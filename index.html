<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Link4M URL Handler</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .container {
      width: min(92%, 500px);
      padding: 30px;
      background: #1d1d1d;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .description {
      color: #aaa;
      text-align: center;
      line-height: 1.5;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #444;
      border-radius: 8px;
      outline: none;
      background: #111;
      color: #fff;
    }

    button {
      padding: 13px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #fff;
      color: #111;
      font-weight: bold;
    }

    button:hover {
      opacity: .85;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .buttons button {
      flex: 1;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #111;
      line-height: 1.6;
      word-break: break-word;
    }

    .success {
      border: 1px solid #3fb950;
    }

    .error {
      border: 1px solid #f85149;
    }

    .domains {
      margin-top: 25px;
      color: #888;
      text-align: center;
      font-size: 13px;
    }

    code {
      color: #ddd;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🔗 Link4M Handler</h1>

    <p class="description">
      Kiểm tra URL Link4M và chuyển hướng tới liên kết hợp lệ.
    </p>

    <div class="input-group">
      <input
        id="urlInput"
        type="url"
        placeholder="https://link4m.com/..."
        autocomplete="off"
      >

      <button onclick="checkUrl()">
        Check
      </button>
    </div>

    <div class="buttons">
      <button onclick="redirectUrl()">
        Redirect
      </button>

      <button onclick="clearResult()">
        Clear
      </button>
    </div>

    <div id="result"></div>

    <div class="domains">
      Hỗ trợ:
      <code>link4m.com</code> ·
      <code>link4m.net</code> ·
      <code>link4m.org</code>
    </div>

  </main>

  <script>
    const input = document.getElementById("urlInput");
    const result = document.getElementById("result");

    function getUrl() {
      const url = input.value.trim();

      if (!url) {
        showResult("Vui lòng nhập URL.", false);
        return null;
      }

      return url;
    }

    async function checkUrl() {
      const url = getUrl();

      if (!url) return;

      result.style.display = "block";
      result.className = "";
      result.textContent = "Đang kiểm tra...";

      try {
        const response = await fetch(
          "/check?url=" + encodeURIComponent(url)
        );

        const data = await response.json();

        if (!data.isLink4M) {
          showResult(
            "❌ URL không thuộc domain Link4M được hỗ trợ.",
            false
          );
          return;
        }

        showResult(
          `
          <strong>✅ URL hợp lệ</strong><br>
          Domain: ${escapeHtml(data.hostname)}<br>
          URL: ${escapeHtml(data.url)}
          `,
          true
        );

      } catch (error) {
        showResult(
          "❌ Không thể kết nối tới server.",
          false
        );
      }
    }

    function redirectUrl() {
      const url = getUrl();

      if (!url) return;

      window.location.href =
        "/redirect?url=" + encodeURIComponent(url);
    }

    function clearResult() {
      input.value = "";
      result.style.display = "none";
      result.innerHTML = "";
    }

    function showResult(message, success) {
      result.style.display = "block";
      result.className = success ? "success" : "error";
      result.innerHTML = message;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkUrl();
      }
    });
  </script>

</body>
</html>
