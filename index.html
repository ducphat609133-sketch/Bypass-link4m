<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Multi Bypass - Devils Will Rise</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif}
.wrapper{width:90%;max-width:550px;text-align:center;padding:15px}
.logo{font-family:'Courier New',monospace;font-size:clamp(22px,5vw,32px);font-weight:bold;color:#ff003c;text-shadow:0 0 20px #ff003c,0 0 40px #ff003c;letter-spacing:3px;margin-bottom:5px;animation:flicker 2s infinite alternate}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:0.8}}
.subtitle{color:#666;font-size:10px;margin-bottom:15px;letter-spacing:2px}
.subtitle span{color:#ff003c}
.badge-row{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:15px}
.badge{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:5px 10px;font-size:10px;color:#888;cursor:pointer;transition:all 0.2s}
.badge:hover{border-color:#ff003c;color:#ff003c}
.badge.active{background:#ff003c;color:#fff;border-color:#ff003c}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:20px;box-shadow:0 0 40px rgba(255,0,60,0.1)}
.input-group{position:relative;margin-bottom:12px}
.input-group input{width:100%;padding:14px 42px 14px 16px;background:#1a1a1a;border:2px solid #333;border-radius:25px;color:#fff;font-size:14px;outline:none;transition:all 0.3s}
.input-group input:focus{border-color:#ff003c;box-shadow:0 0 20px rgba(255,0,60,0.2)}
.input-group input::placeholder{color:#555}
.input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#555;font-size:16px;pointer-events:none}
.btn-row{display:flex;gap:8px}
.btn-bypass{flex:1;padding:13px;background:#ff003c;color:#fff;border:none;border-radius:25px;font-size:15px;font-weight:bold;cursor:pointer;letter-spacing:2px;text-transform:uppercase}
.btn-bypass:active{transform:scale(0.97)}
.btn-bypass.loading{pointer-events:none;opacity:0.7}
.btn-open{width:46px;background:#222;color:#ff003c;border:1px solid #ff003c;border-radius:25px;font-size:16px;cursor:pointer;display:none}
.btn-open.show{display:block}
.result-box{margin-top:14px;background:#0d0d0d;border:2px solid #222;border-radius:12px;padding:16px;min-height:50px;display:flex;align-items:center;justify-content:center;word-break:break-all;cursor:pointer;flex-direction:column;gap:6px;transition:all 0.3s}
.result-box.success{border-color:#00ff41;box-shadow:0 0 20px rgba(0,255,65,0.15)}
.result-box.warning{border-color:#ff6600;box-shadow:0 0 20px rgba(255,102,0,0.15)}
.result-box.error{border-color:#ff003c}
.result-text{color:#00ff41;font-size:13px;font-family:'Courier New',monospace}
.result-text-warning{color:#ff6600;font-size:13px;font-family:'Courier New',monospace}
.result-type{color:#ffcc00;font-size:10px;text-transform:uppercase;letter-spacing:1px}
.result-status{font-size:10px;margin-top:4px;padding:4px 10px;border-radius:10px;font-weight:bold;text-align:center;line-height:1.4}
.result-status.alive{background:#002200;color:#00ff41;border:1px solid #00ff41}
.result-status.dead{background:#220000;color:#ff4444;border:1px solid #ff4444}
.result-status.unknown{background:#221100;color:#ff6600;border:1px solid #ff6600}
.result-placeholder{color:#333;font-size:12px}
.copy-hint{color:#666;font-size:10px;margin-top:6px;opacity:0}
.copy-hint.visible{opacity:1}
.spinner{width:20px;height:20px;border:3px solid #333;border-top:3px solid #ff003c;border-radius:50%;animation:spin 0.7s linear infinite;display:none;margin:8px auto 0}
.spinner.active{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#00ff41;color:#000;padding:10px 25px;border-radius:20px;font-weight:bold;font-size:13px;z-index:999;opacity:0;pointer-events:none;transition:opacity 0.3s}
.toast.show{opacity:1}
.footer-row{margin-top:14px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.footer-link{color:#444;font-size:10px;cursor:pointer}
.footer-link:hover{color:#ff003c}
.log-box{margin-top:8px;background:#0a0a0a;border-radius:8px;padding:8px;max-height:100px;overflow-y:auto;display:none}
.log-box.active{display:block}
.log-line{color:#555;font-size:9px;font-family:'Courier New',monospace;text-align:left;padding:1px 0}
.log-line.good{color:#00ff41}
.log-line.bad{color:#ff4444}
.log-line.info{color:#ffcc00}
.log-line.warn{color:#ff6600}
</style>
</head>
<body>
<div class="toast" id="toast">✅ Đã copy!</div>
<div class="wrapper">
<div class="logo">DEVILS WILL RISE</div>
<div class="subtitle">Owner <span>@DP</span> | <span>@SGCodexs</span></div>
<div class="badge-row" id="badgeRow">
<span class="badge active" data-site="auto">🤖 AUTO</span>
<span class="badge" data-site="link4m">Link4m (.com/.net)</span>
<span class="badge" data-site="ouo">OUO.io</span>
<span class="badge" data-site="shrinkme">ShrinkMe</span>
<span class="badge" data-site="workink">Work.ink</span>
<span class="badge" data-site="adfly">AdFly</span>
<span class="badge" data-site="bitly">Bit.ly</span>
<span class="badge" data-site="tinyurl">TinyURL</span>
</div>
<div class="card">
<div class="input-group">
<input type="text" id="linkInput" placeholder="Dán link rút gọn vào đây..." autocomplete="off" autofocus>
<span class="input-icon">🔗</span>
</div>
<div class="btn-row">
<button class="btn-bypass" id="btnBypass" onclick="doBypass()">⚡ BYPASS NGAY</button>
<button class="btn-open" id="btnOpen" onclick="openResult()" title="Mở link">↗</button>
</div>
<div class="spinner" id="spinner"></div>
<div class="result-box" id="resultBox" onclick="copyResult()">
<span class="result-placeholder">Link gốc sẽ hiện ở đây...</span>
</div>
<div class="copy-hint" id="copyHint">👆 Click để copy | ↗ Mở trực tiếp</div>
<div class="log-box" id="logBox"></div>
</div>
<div class="footer-row">
<span class="footer-link" onclick="clearAll()">🗑 Clear</span>
<span style="color:#333">|</span>
<span class="footer-link">💀 @SGCodexs</span>
<span style="color:#333">|</span>
<span class="footer-link" onclick="toggleLog()">📋 Log</span>
</div>
</div>

<script>
// ===== BIẾN =====
var finalUrl='';
var selectedSite='auto';
var logOpen=false;

// ===== BADGE CLICK =====
document.getElementById('badgeRow').onclick=function(e){
if(e.target.classList.contains('badge')){
var all=document.querySelectorAll('.badge');
for(var i=0;i<all.length;i++)all[i].classList.remove('active');
e.target.classList.add('active');
selectedSite=e.target.getAttribute('data-site');
log('🏷 Đã chọn: '+selectedSite.toUpperCase(),'info');
document.getElementById('linkInput').focus();
}
};

// ===== ENTER =====
document.getElementById('linkInput').onkeydown=function(e){
if(e.key==='Enter')doBypass();
};

// ===== LOG =====
function log(msg,type){
var lb=document.getElementById('logBox');
var cls=type==='good'?'good':(type==='bad'?'bad':(type==='info'?'info':'warn'));
lb.innerHTML+='<div class="log-line '+cls+'">'+msg+'</div>';
lb.scrollTop=lb.scrollHeight;
}
function toggleLog(){
logOpen=!logOpen;
var lb=document.getElementById('logBox');
if(logOpen)lb.classList.add('active');else lb.classList.remove('active');
}

// ===== NHẬN DIỆN =====
function detectSite(url){
var l=url.toLowerCase();
if(l.indexOf('link4m.com')!==-1||l.indexOf('link4m.net')!==-1||l.indexOf('link4m.')!==-1)return'link4m';
if(l.indexOf('ouo.io')!==-1||l.indexOf('ouo.press')!==-1)return'ouo';
if(l.indexOf('shrinkme.io')!==-1||l.indexOf('shrinkme.')!==-1)return'shrinkme';
if(l.indexOf('work.ink')!==-1)return'workink';
if(l.indexOf('adf.ly')!==-1||l.indexOf('adfoc.us')!==-1||l.indexOf('j.gs')!==-1||l.indexOf('q.gs')!==-1)return'adfly';
if(l.indexOf('bit.ly')!==-1||l.indexOf('bitly.')!==-1)return'bitly';
if(l.indexOf('tinyurl.com')!==-1||l.indexOf('tinyurl.')!==-1)return'tinyurl';
if(l.indexOf('google.com/url')!==-1)return'google';
return'unknown';
}

function siteLabel(s){
var m={link4m:'Link4m',ouo:'OUO.io',shrinkme:'ShrinkMe',workink:'Work.ink',adfly:'AdFly',bitly:'Bit.ly',tinyurl:'TinyURL',google:'Google',unknown:'Unknown'};
return m[s]||s;
}

// ===== EXTRACT LINK =====
function extractLinks(html){
html=html.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\\\//g,'/');
var all=[];

// Meta refresh
var m1=html.match(/<meta[^>]*http-equiv\s*=\s*["']refresh["'][^>]*content\s*=\s*["']\d+\s*;\s*url\s*=\s*([^"'\s>]+)/i);
if(m1&&m1[1])all.push(m1[1]);

// window.location
var m2=html.match(/window\.location(?:\s*\.\s*href)?\s*=\s*["']([^"']+)["']/gi);
if(m2)for(var i=0;i<m2.length;i++){var t=m2[i].match(/["']([^"']+)["']/);if(t&&t[1])all.push(t[1])}

// location.replace/href/assign
var m3=html.match(/location\.(?:replace|assign|href)\s*\(\s*["']([^"']+)["']\s*\)/gi);
if(m3)for(var i=0;i<m3.length;i++){var t=m3[i].match(/["']([^"']+)["']/);if(t&&t[1])all.push(t[1])}

// window.open
var m4=html.match(/window\.open\s*\(\s*["']([^"']+)["']/gi);
if(m4)for(var i=0;i<m4.length;i++){var t=m4[i].match(/["']([^"']+)["']/);if(t&&t[1])all.push(t[1])}

// <a href>
var m5=html.match(/<a[^>]*href\s*=\s*["'](https?:\/\/[^"']+)["'][^>]*>/gi);
if(m5)for(var i=0;i<m5.length;i++){var t=m5[i].match(/href\s*=\s*["']([^"']+)["']/i);if(t&&t[1])all.push(t[1])}

// onclick
var m6=html.match(/onclick\s*=\s*["'][^"']*(?:location|window\.open|href)\s*[=\(]\s*["']([^"']+)["']/gi);
if(m6)for(var i=0;i<m6.length;i++){var t=m6[i].match(/["']([^"']{5,})["']/g);if(t){var u=t[t.length-1].replace(/["']/g,'');if(u.length>5)all.push(u)}}

// data-url/link/href
var m7=html.match(/data-(?:url|link|href|redirect|target|dest|go|download|file)\s*=\s*["'](https?:\/\/[^"']+)["']/gi);
if(m7)for(var i=0;i<m7.length;i++){var t=m7[i].match(/["'](https?:\/\/[^"']+)["']/i);if(t&&t[1])all.push(t[1])}

// atob
var m8=html.match(/atob\s*\(\s*["']([A-Za-z0-9+/=]{20,})["']\s*\)/g);
if(m8)for(var i=0;i<m8.length;i++){var t=m8[i].match(/["']([A-Za-z0-9+/=]{20,})["']/);if(t&&t[1])try{var d=atob(t[1]);if(d.indexOf('http')===0)all.push(d)}catch(e){}}

// var/let/const url = "..."
var m9=html.match(/(?:var|let|const)\s+\w+\s*=\s*["'](https?:\/\/[^\s"'<>]{15,}?)["']/gi);
if(m9)for(var i=0;i<m9.length;i++){var t=m9[i].match(/["'](https?:\/\/[^"']+)["']/);if(t&&t[1])all.push(t[1])}

// JSON key: "url":"...", "link":"...", "redirect":"..."
var m10=html.match(/["'](?:url|link|redirect|target|dest|download|file|get|go|direct|source|drive)["']\s*:\s*["'](https?:\/\/[^"']{8,}?)["']/gi);
if(m10)for(var i=0;i<m10.length;i++){var t=m10[i].match(/["'](https?:\/\/[^"']+)["']/);if(t&&t[1])all.push(t[1])}

// Script content
var scripts=[];var sr=/<script[^>]*>([\s\S]*?)<\/script>/gi;var sm;
while((sm=sr.exec(html))!==null)scripts.push(sm[1]);
for(var s=0;s<scripts.length;s++){
var sc=scripts[s];
var su=sc.match(/https?:\/\/[^\s"'`\[\]{}()\\]{10,}/gi);if(su)all=all.concat(su);
var eu=sc.match(/https?:\\\/\\\/[^\s"'`\[\]{}()\\]{10,}/gi);if(eu)for(var i=0;i<eu.length;i++)all.push(eu[i].replace(/\\\//g,'/'));
var lm=sc.match(/(?:location|window|top)\s*\.\s*(?:href)?\s*=\s*["']([^"']{5,})["']/gi);
if(lm)for(var i=0;i<lm.length;i++){var t=lm[i].match(/["']([^"']{5,})["']/);if(t&&t[1])all.push(t[1])}
}

// Tất cả URL thô
var ru=html.match(/https?:\/\/[^\s"'<>\[\]{}()\\]{10,}/gi);
if(ru)all=all.concat(ru);

// Làm sạch
var clean=[];
for(var i=0;i<all.length;i++){
var u=all[i];if(typeof u!=='string')continue;
u=u.replace(/\\/g,'').replace(/&amp;/g,'&').trim().replace(/^["']|["']$/g,'');
if(u.indexOf('//')===0)u='https:'+u;
if(u.indexOf('http')===0&&u.length>12)clean.push(u);
}

// Loại trùng
var seen={};var unique=[];
for(var i=0;i<clean.length;i++){if(!seen[clean[i]]){seen[clean[i]]=true;unique.push(clean[i])}}

log('  📎 Tìm thấy '+unique.length+' link sạch');

// Blacklist
var bl=['challenges.cloudflare.com','cloudflare.com','link4m.com','link4m.net','link4m.','ouo.io','ouo.press','shrinkme.io','shrinkme.','work.ink','adf.ly','adfoc.us','j.gs','q.gs','ay.gy','bit.ly','bitly.','tinyurl.com','tinyurl.','shorte.st','gestyy.com','google.com','facebook.com','twitter.com','youtube.com','instagram.com','tiktok.com','w3.org','schema.org','jquery','bootstrap','fontawesome','googletagmanager','gstatic','googleapis','.js','.css','.png','.jpg','.jpeg','.svg','.ico','.gif','.woff','ajax','analytics','gtag','facebook.net','doubleclick','pinterest','cdn.','static.'];
var final=[];
for(var i=0;i<unique.length;i++){
var u=unique[i];var l=u.toLowerCase();
var blocked=false;
for(var j=0;j<bl.length;j++){if(l.indexOf(bl[j])!==-1){blocked=true;break}}
if(!blocked&&u.length>15&&l.indexOf('.js')===-1&&l.indexOf('.css')===-1)final.push(u);
}

log('  🔍 Sau blacklist: '+final.length+' link');

if(final.length===0)return null;

// Ưu tiên
var priority=['drive.google.com','docs.google.com','mega.nz','mediafire.com','dropbox.com','pastebin.com','github.com','download','file','get','key','code','paste','source','dll','media','share','direct','raw','zip','rar','7z','exe','apk','ipa','pdf','mp4','mp3'];
for(var i=0;i<priority.length;i++){
for(var j=0;j<final.length;j++){
if(final[j].toLowerCase().indexOf(priority[i])!==-1){
log('  ⭐ Ưu tiên: '+priority[i],'good');
return final[j];
}
}
}

// Link dài nhất
var longest=final[0];
for(var i=1;i<final.length;i++){if(final[i].length>longest.length)longest=final[i]}
return longest;
}

// ===== CLEAN URL =====
function cleanUrl(u){
u=u.replace(/\\/g,'').replace(/&amp;/g,'&').replace(/%3A/g,':').replace(/%2F/g,'/').replace(/%3F/g,'?').replace(/%3D/g,'=').replace(/%26/g,'&').trim();
if(u.indexOf('http')!==0)u='https://'+u.replace(/^\/+/,'');
return u;
}

// ===== LOẠI LINK =====
function getLinkType(u){
var l=u.toLowerCase();
if(l.indexOf('drive.google.com')!==-1)return'📁 Google Drive';
if(l.indexOf('docs.google.com')!==-1)return'📄 Google Docs';
if(l.indexOf('mega.nz')!==-1)return'📦 MEGA';
if(l.indexOf('mediafire.com')!==-1)return'📁 MediaFire';
if(l.indexOf('dropbox.com')!==-1)return'📦 Dropbox';
if(l.indexOf('pastebin.com')!==-1)return'📝 Pastebin';
if(l.indexOf('github.com')!==-1)return'💻 GitHub';
if(l.indexOf('.zip')!==-1||l.indexOf('.rar')!==-1||l.indexOf('.7z')!==-1)return'🗜 File nén';
if(l.indexOf('.exe')!==-1||l.indexOf('.apk')!==-1)return'📱 File cài đặt';
if(l.indexOf('.mp4')!==-1||l.indexOf('.mp3')!==-1||l.indexOf('.pdf')!==-1)return'🎬 File media';
return'🔗 Link trực tiếp';
}

// ===== CHECK LINK =====
async function checkLinkStatus(u){
log('🔬 Kiểm tra link...','info');
var r={alive:false,isFile:false,fileName:'',fileSize:'',httpCode:0,contentType:''};
try{
var ctrl=new AbortController();
var to=setTimeout(function(){ctrl.abort()},8000);
var res=await fetch(u,{method:'HEAD',signal:ctrl.signal,headers:{'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}});
clearTimeout(to);
r.httpCode=res.status;
r.contentType=res.headers.get('content-type')||'';
r.fileSize=res.headers.get('content-length')||'';
var disp=res.headers.get('content-disposition')||'';

if(res.status===200||res.status===302||res.status===301){r.alive=true;log('✅ HTTP '+res.status+' - Link sống!','good')}
else if(res.status===404){log('❌ 404 - Link chết!','bad')}
else{log('⚠ HTTP '+res.status,'warn')}

var ct=r.contentType.toLowerCase();
if(ct.indexOf('zip')!==-1||ct.indexOf('rar')!==-1||ct.indexOf('7z')!==-1||ct.indexOf('octet-stream')!==-1||ct.indexOf('exe')!==-1||ct.indexOf('apk')!==-1||ct.indexOf('pdf')!==-1||ct.indexOf('mp4')!==-1||ct.indexOf('mpeg')!==-1||ct.indexOf('android')!==-1){
r.isFile=true;r.fileName=getFileName(u,ct);log('📁 FILE: '+r.fileName+' ('+fmtSize(r.fileSize)+')','good');
}else if(disp.indexOf('attachment')!==-1||disp.indexOf('filename')!==-1){
r.isFile=true;var fm=disp.match(/filename[^;=\n]*=["']?([^"';\n]+)["']?/i);if(fm)r.fileName=fm[1];log('📥 File: '+r.fileName,'good');
}else if(ct.indexOf('html')!==-1||ct.indexOf('text')!==-1){
log('🌐 Trang web, không phải file','info');
}
}catch(e){log('❌ Không check được: '+e.message.substring(0,30),'bad')}

// Fallback URL pattern
if(!r.isFile&&!r.contentType){
var l=u.toLowerCase();
var exts=['.zip','.rar','.7z','.exe','.apk','.ipa','.pdf','.mp4','.mp3','.mkv','.avi','.dmg','.iso','.tar','.gz','.torrent'];
for(var i=0;i<exts.length;i++){if(l.indexOf(exts[i])!==-1){r.isFile=true;r.fileName=getFileName(u,'');log('📁 Đuôi file: '+exts[i],'good');break}}
}
if(!r.isFile){
var dks=['download','file','get','dl=','/dl/','/file/','/get/','/d/','?download'];
for(var j=0;j<dks.length;j++){if(l.indexOf(dks[j])!==-1){r.isFile=true;log('📁 Keyword: '+dks[j],'good');break}}
}
return r;
}

function getFileName(u,ct){
var p=u.split('/');var lp=p[p.length-1].split('?')[0];
if(lp&&lp.length>2&&lp.indexOf('.')!==-1)return decodeURIComponent(lp);
var cm={'application/zip':'file.zip','application/x-rar-compressed':'file.rar','application/x-7z-compressed':'file.7z','application/octet-stream':'file.bin','application/pdf':'file.pdf','video/mp4':'video.mp4','audio/mpeg':'audio.mp3','application/vnd.android.package-archive':'app.apk'};
for(var k in cm){if(ct.indexOf(k)!==-1)return cm[k]}
return'unknown_file';
}

function fmtSize(b){
if(!b||b==='0')return'Không rõ';
var n=parseInt(b);if(isNaN(n))return b;
if(n<1024)return n+' B';
if(n<1048576)return(n/1024).toFixed(1)+' KB';
if(n<1073741824)return(n/1048576).toFixed(1)+' MB';
return(n/1073741824).toFixed(2)+' GB';
}

// ===== BYPASS CHÍNH =====
async function doBypass(){
var input=document.getElementById('linkInput');
var btn=document.getElementById('btnBypass');
var spinner=document.getElementById('spinner');
var resultBox=document.getElementById('resultBox');
var copyHint=document.getElementById('copyHint');
var logBox=document.getElementById('logBox');
var btnOpen=document.getElementById('btnOpen');
var url=input.value.trim();

logBox.innerHTML='';logBox.classList.add('active');logOpen=true;

if(!url){showResultSimple('⚠ Vui lòng nhập link!',false);return}

// Xác định site
var site=selectedSite==='auto'?detectSite(url):selectedSite;
log('🔍 '+siteLabel(site)+' | '+url.substring(0,50)+'...','info');
log('📎 Link đầy đủ: '+url,'info');

btn.classList.add('loading');btn.textContent='ĐANG BYPASS...';spinner.classList.add('active');
resultBox.className='result-box';resultBox.innerHTML='';copyHint.classList.remove('visible');
btnOpen.classList.remove('show');finalUrl='';
var F=null;

// ===== GOOGLE =====
if(site==='google'){
var m=url.match(/[?&]url=([^&]+)/i);
if(m)F=decodeURIComponent(m[1]);
if(!F){var m2=url.match(/[?&]q=([^&]+)/i);if(m2)F=decodeURIComponent(m2[1])}
