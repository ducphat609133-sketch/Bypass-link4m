<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bypass Tool - Devils Will Rise</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif}
.wrapper{width:90%;max-width:500px;text-align:center;padding:15px}
.logo{font-family:'Courier New',monospace;font-size:28px;font-weight:bold;color:#ff003c;text-shadow:0 0 20px #ff003c;letter-spacing:3px;margin-bottom:3px}
.subtitle{color:#666;font-size:10px;margin-bottom:18px}
.subtitle span{color:#ff003c}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:20px}
input{width:100%;padding:14px;background:#1a1a1a;border:2px solid #333;border-radius:25px;color:#fff;font-size:14px;outline:none;margin-bottom:12px;text-align:center}
input:focus{border-color:#ff003c}
.btn-row{display:flex;gap:8px}
.btn-row button{flex:1;padding:14px;background:#ff003c;color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;letter-spacing:2px}
.btn-row .btn-open{flex:0;width:50px;background:#222;color:#ff003c;border:1px solid #ff003c;font-size:18px}
button:active{transform:scale(0.97)}
button.loading{opacity:0.6;pointer-events:none}
.result-box{margin-top:14px;background:#0d0d0d;border:2px solid #222;border-radius:12px;padding:16px;min-height:50px;word-break:break-all;cursor:pointer;font-family:'Courier New',monospace;font-size:13px}
.result-box.success{border-color:#00ff41;color:#00ff41}
.result-box.error{border-color:#ff003c;color:#ff4444}
.result-box.info{border-color:#ffcc00;color:#ffcc00}
.placeholder{color:#333;font-size:12px}
.log-box{margin-top:10px;background:#0a0a0a;border-radius:8px;padding:10px;max-height:150px;overflow-y:auto;text-align:left;display:none}
.log-box.show{display:block}
.log-line{color:#555;font-size:10px;font-family:'Courier New',monospace;padding:2px 0}
.log-line.good{color:#00ff41}
.log-line.bad{color:#ff4444}
.log-line.info{color:#ffcc00}
.log-line.warn{color:#ff6600}
.spinner{width:24px;height:24px;border:3px solid #333;border-top:3px solid #ff003c;border-radius:50%;animation:spin 0.8s linear infinite;margin:10px auto;display:none}
.spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:14px;color:#444;font-size:10px}
.footer span{color:#ff003c;cursor:pointer}
.footer span:hover{color:#fff}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#00ff41;color:#000;padding:8px 20px;border-radius:20px;font-weight:bold;font-size:12px;z-index:999;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="toast" id="toast">✅ Đã copy!</div>
<div class="wrapper">
<div class="logo">DEVILS WILL RISE</div>
<div class="subtitle">Owner <span>@DP</span> | <span>@SGCodexs</span></div>
<div class="card">
<input type="text" id="linkInput" placeholder="Dán link Link4m / OUO / AdFly... vào đây" autocomplete="off" autofocus>
<div class="btn-row">
<button id="btnBypass" onclick="bypass()">⚡ BYPASS</button>
<button class="btn-open" id="btnOpen" onclick="openLink()" style="display:none">↗</button>
</div>
<div class="spinner" id="spinner"></div>
<div class="result-box" id="resultBox" onclick="copyLink()">
<span class="placeholder">Kết quả sẽ hiện ở đây...</span>
</div>
<div class="log-box" id="logBox"></div>
</div>
<div class="footer">
<span onclick="clearAll()">🗑 Clear</span> | <span>💀 @SGCodexs</span> | <span onclick="toggleLog()">📋 Log</span>
</div>
</div>

<script>
var finalLink='';
var logVisible=true;

document.getElementById('linkInput').addEventListener('keydown',function(e){if(e.key==='Enter')bypass()});

function log(msg,type){
var lb=document.getElementById('logBox');
lb.classList.add('show');
var cls=type||'';
lb.innerHTML+='<div class="log-line '+cls+'">'+msg+'</div>';
lb.scrollTop=lb.scrollHeight;
}
function toggleLog(){logVisible=!logVisible;var lb=document.getElementById('logBox');if(logVisible)lb.classList.add('show');else lb.classList.remove('show')}
function showLoading(s){var sp=document.getElementById('spinner');var b=document.getElementById('btnBypass');if(s){sp.classList.add('show');b.classList.add('loading');b.textContent='ĐANG XỬ LÝ...'}else{sp.classList.remove('show');b.classList.remove('loading');b.textContent='⚡ BYPASS'}}
function showResult(msg,type){var rb=document.getElementById('resultBox');rb.className='result-box';if(type==='success')rb.classList.add('success');else if(type==='error')rb.classList.add('error');else rb.classList.add('info');rb.innerHTML=msg}

function extractBestLink(html){
html=html.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\\\//g,'/');

var found=[];

// Meta refresh
var m1=html.match(/<meta[^>]*http-equiv\s*=\s*["']refresh["'][^>]*content\s*=\s*["']\d+\s*;\s*url\s*=\s*([^"'\s>]+)/i);
if(m1&&m1[1])found.push(m1[1]);

// window.location = "..."
var m2=html.match(/window\.location(?:\s*\.\s*href)?\s*=\s*["']([^"']{5,})["']/gi);
if(m2)for(var i=0;i<m2.length;i++){var t=m2[i].match(/["']([^"']+)["']/);if(t)found.push(t[1])}

// location.replace/href/assign("...")
var m3=html.match(/location\.(?:replace|assign|href)\s*\(\s*["']([^"']{5,})["']\s*\)/gi);
if(m3)for(var i=0;i<m3.length;i++){var t=m3[i].match(/["']([^"']+)["']/);if(t)found.push(t[1])}

// window.open("...")
var m4=html.match(/window\.open\s*\(\s*["']([^"']{5,})["']/gi);
if(m4)for(var i=0;i<m4.length;i++){var t=m4[i].match(/["']([^"']+)["']/);if(t)found.push(t[1])}

// <a href="...">
var m5=html.match(/<a[^>]*href\s*=\s*["'](https?:\/\/[^"']+?)["'][^>]*>/gi);
if(m5)for(var i=0;i<m5.length;i++){var t=m5[i].match(/href\s*=\s*["']([^"']+)["']/i);if(t)found.push(t[1])}

// onclick="location='...'"
var m6=html.match(/onclick\s*=\s*["'][^"']*(?:location|window\.open|href)\s*[=\(]\s*["']([^"']{5,})["']/gi);
if(m6)for(var i=0;i<m6.length;i++){var t=m6[i].match(/["']([^"']{5,})["']$/);if(t)found.push(t[1])}

// data-url="..."
var m7=html.match(/data-(?:url|link|href|redirect|target|dest|go|download|file|direct)\s*=\s*["'](https?:\/\/[^"']+)["']/gi);
if(m7)for(var i=0;i<m7.length;i++){var t=m7[i].match(/["'](https?:\/\/[^"']+)["']/i);if(t)found.push(t[1])}

// atob("...")
var m8=html.match(/atob\s*\(\s*["']([A-Za-z0-9+/=]{20,})["']\s*\)/g);
if(m8)for(var i=0;i<m8.length;i++){var t=m8[i].match(/["']([A-Za-z0-9+/=]{20,})["']/);if(t)try{var d=atob(t[1]);if(d.indexOf('http')===0)found.push(d)}catch(e){}}

// var x = "https://..."
var m9=html.match(/(?:var|let|const)\s+\w+\s*=\s*["'](https?:\/\/[^\s"'<>]{15,}?)["']/gi);
if(m9)for(var i=0;i<m9.length;i++){var t=m9[i].match(/["'](https?:\/\/[^"']+)["']/);if(t)found.push(t[1])}

// "url":"...", "link":"..."
var m10=html.match(/["'](?:url|link|redirect|target|dest|download|file|get|go|direct|source|drive)["']\s*:\s*["'](https?:\/\/[^"']{8,}?)["']/gi);
if(m10)for(var i=0;i<m10.length;i++){var t=m10[i].match(/["'](https?:\/\/[^"']+)["']/);if(t)found.push(t[1])}

// Script content
var scripts=[];var sr=/<script[^>]*>([\s\S]*?)<\/script>/gi;var sm;
while((sm=sr.exec(html))!==null)scripts.push(sm[1]);
for(var s=0;s<scripts.length;s++){
var sc=scripts[s];
var su=sc.match(/https?:\/\/[^\s"'`\[\]{}()\\]{10,}/gi);if(su)found=found.concat(su);
var eu=sc.match(/https?:\\\/\\\/[^\s"'`\[\]{}()\\]{10,}/gi);if(eu)for(var e=0;e<eu.length;e++)found.push(eu[e].replace(/\\\//g,'/'));
}

// TẤT CẢ URL
var allUrls=html.match(/https?:\/\/[^\s"'<>\[\]{}()\\]{10,}/gi);
if(allUrls)found=found.concat(allUrls);

// Làm sạch
var clean=[];
for(var i=0;i<found.length;i++){
var u=found[i];if(typeof u!=='string')continue;
u=u.replace(/\\/g,'').trim().replace(/^["'`]+|["'`]+$/g,'');
if(u.indexOf('//')===0)u='https:'+u;
if(u.indexOf('http')===0&&u.length>15)clean.push(u);
}

// Loại trùng
var seen={};var unique=[];
for(var i=0;i<clean.length;i++){if(!seen[clean[i]]){seen[clean[i]]=true;unique.push(clean[i])}}
log('  📊 Link unique: '+unique.length);

// Blacklist
var bl=['cloudflare.com','challenges.cloudflare.com','link4m.com','link4m.net','link4m.','google.com','facebook.com','twitter.com','youtube.com','instagram.com','tiktok.com','w3.org','schema.org','jquery','bootstrap','fontawesome','googletagmanager','gstatic','googleapis','doubleclick','facebook.net','pinterest','cdnjs','jsdelivr','unpkg','.js','.css','.png','.jpg','.jpeg','.svg','.ico','.gif','.woff','.ttf','ajax','analytics','gtag'];
var filtered=[];
for(var i=0;i<unique.length;i++){
var u=unique[i];var l=u.toLowerCase();
var bad=false;
for(var j=0;j<bl.length;j++){if(l.indexOf(bl[j])!==-1){bad=true;break}}
if(!bad)filtered.push(u);
}
log('  🔍 Sau blacklist: '+filtered.length);

// Ưu tiên
var prio=['drive.google.com','docs.google.com','mega.nz','mediafire.com','dropbox.com','pastebin.com','github.com','download','/file/','/get/','/dl/','file','get','key','code','paste','source','dll','media','share','direct','raw','zip','rar','7z','exe','apk','ipa','pdf','mp4','mp3'];
for(var i=0;i<prio.length;i++){
for(var j=0;j<filtered.length;j++){
if(filtered[j].toLowerCase().indexOf(prio[i])!==-1){
log('  ⭐ Ưu tiên: '+prio[i],'good');
return filtered[j];
}
}
}

if(filtered.length>0){
var longest=filtered[0];
for(var i=1;i<filtered.length;i++){if(filtered[i].length>longest.length)longest=filtered[i]}
log('  📏 Dài nhất: '+longest.length+' ký tự');
return longest;
}
return null;
}

async function bypass(){
var input=document.getElementById('linkInput');
var url=input.value.trim();
var logBox=document.getElementById('logBox');
var btnOpen=document.getElementById('btnOpen');

logBox.innerHTML='';
btnOpen.style.display='none';
finalLink='';

if(!url){showResult('⚠ Vui lòng nhập link!','error');return}

log('🔍 Bắt đầu bypass...','info');
log('📎 Link: '+url,'info');
showLoading(true);
showResult('Đang xử lý...','info');

var result=null;

// Method 1: Bypass.pm API
log('📡 Method 1: Bypass.pm API','info');
try{
var res1=await fetch('https://bypass.pm/bypass',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})});
if(res1.ok){var data=await res1.json();if(data.destination){result=data.destination;log('✅ Bypass.pm OK','good')}else if(data.url){result=data.url;log('✅ Bypass.pm OK','good')}}else{log('❌ HTTP '+res1.status,'bad')}
}catch(e){log('❌ Lỗi: '+e.message,'bad')}

// Method 2: Jina AI
if(!result){
log('📡 Method 2: Jina AI','info');
try{
var jinaUrl='https://r.jina.ai/https://'+url.replace('https://','').replace('http://','');
var res2=await fetch(jinaUrl,{headers:{'Accept':'text/markdown'}});
if(res2.ok){
var text=await res2.text();
log('✅ Jina OK - '+text.length+' ký tự','good');
if(text.indexOf('turnstile')!==-1||text.indexOf('cloudflare')!==-1){log('⚠ Jina bị Cloudflare','warn')}
else{var ext=extractBestLink(text);if(ext){result=ext;log('🎯 Tìm thấy!','good')}else{log('⚠ Không thấy link','warn')}}
}else{log('❌ HTTP '+res2.status,'bad')}
}catch(e){log('❌ Lỗi: '+e.message,'bad')}
}

// Method 3: Proxy
if(!result){
log('📡 Method 3: Proxy fetch','info');
var proxies=['https://api.allorigins.win/raw?url=','https://corsproxy.io/?','https://api.codetabs.com/v1/proxy?quest='];
for(var p=0;p<proxies.length;p++){
if(result)break;
try{
var proxyUrl=proxies[p]+encodeURIComponent(url);
log('  Thử proxy #'+(p+1)+'...');
var res3=await fetch(proxyUrl,{headers:{'User-Agent':'Mozilla/5.0'}});
if(res3.ok){
var html=await res3.text();
log('  ✅ Proxy #'+(p+1)+' OK - '+html.length+' ký tự','good');
if(html.indexOf('challenges.cloudflare.com')!==-1||html.indexOf('turnstile')!==-1||html.indexOf('cf-browser-verify')!==-1){
log('  ⚠ Cloudflare, bỏ qua','warn');continue;
}
var ext=extractBestLink(html);
if(ext){result=ext;log('  🎯 TÌM THẤY!','good');break}
else{log('  ⚠ Không thấy link','warn')}
}else{log('  ❌ HTTP '+res3.status,'bad')}
}catch(e){log('  ❌ Lỗi: '+e.message,'bad')}
}
}

showLoading(false);

if(result){
result=result.replace(/\\/g,'').replace(/&amp;/g,'&').trim();
if(result.indexOf('http')!==0)result='https://'+result.replace(/^\/+/,'');
finalLink=result;
showResult('✅ '+result,'success');
btnOpen.style.display='block';
log('🏆 THÀNH CÔNG!','good');
}else{
showResult('❌ KHÔNG BYPASS ĐƯỢC\nThử link khác nhé!','error');
log('💀 THẤT BẠI','bad');
}
}

function copyLink(){
if(finalLink&&finalLink.indexOf('http')===0){
navigator.clipboard.writeText(finalLink).then(function(){
var t=document.getElementById('toast');t.classList.add('show');
setTimeout(function(){t.classList.remove('show')},1500);
}).catch(function(){
var ta=document.createElement('textarea');ta.value=finalLink;
ta.style.position='fixed';ta.style.left='-9999px';
document.body.appendChild(ta);ta.select();
document.execCommand('copy');document.body.removeChild(ta);
var t=document.getElementById('toast');t.classList.add('show');
setTimeout(function(){t.classList.remove('show')},1500);
});
}
}
function openLink(){if(finalLink&&finalLink.indexOf('http')===0)window.open(finalLink,'_blank')}
function clearAll(){
document.getElementById('linkInput').value='';
document.getElementById('resultBox').className='result-box';
document.getElementById('resultBox').innerHTML='<span class="placeholder">Kết quả sẽ hiện ở đây...</span>';
document.getElementById('logBox').innerHTML='';
document.getElementById('btnOpen').style.display='none';
finalLink='';
document.getElementById('linkInput').focus();
}
</script>
</body>
</html>
