<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Link4m Bypass - Devils Will Rise</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif;padding:15px}
.wrap{width:100%;max-width:450px;text-align:center}
h1{color:#ff003c;font-family:monospace;font-size:26px;margin-bottom:5px;text-shadow:0 0 20px #ff003c;letter-spacing:3px}
.sub{color:#666;font-size:10px;margin-bottom:15px}
.sub span{color:#ff003c}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:18px}
input{width:100%;padding:14px;background:#1a1a1a;border:2px solid #333;border-radius:25px;color:#fff;font-size:14px;outline:none;margin-bottom:10px;text-align:center}
input:focus{border-color:#ff003c}
button{width:100%;padding:14px;background:#ff003c;color:#fff;border:none;border-radius:25px;font-size:15px;font-weight:bold;cursor:pointer;letter-spacing:2px}
button:active{transform:scale(0.97)}
button:disabled{opacity:0.5}
.res{margin-top:12px;background:#0d0d0d;border:2px solid #222;border-radius:12px;padding:15px;min-height:40px;word-break:break-all;font-family:monospace;font-size:13px;line-height:1.5;cursor:pointer}
.res.good{border-color:#00ff41;color:#00ff41}
.res.bad{border-color:#ff003c;color:#ff4444}
.res.wait{border-color:#ffcc00;color:#ffcc00}
.placeholder{color:#333;font-size:12px}
.load{width:20px;height:20px;border:3px solid #333;border-top:3px solid #ff003c;border-radius:50%;animation:spin 0.7s linear infinite;margin:8px auto;display:none}
.load.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{margin-top:12px;color:#444;font-size:10px}
.foot span{color:#ff003c;cursor:pointer}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#00ff41;color:#000;padding:8px 18px;border-radius:20px;font-weight:bold;font-size:12px;z-index:999;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="toast" id="toast">Copied!</div>
<div class="wrap">
<h1>LINK4M BYPASS</h1>
<div class="sub">Owner <span>@DP</span> | <span>@SGCodexs</span></div>
<div class="card">
<input type="text" id="url" placeholder="Paste link Link4m..." autofocus>
<button id="btn" onclick="bypass()">BYPASS</button>
<div class="load" id="load"></div>
<div class="res" id="res" onclick="copyRes()">
<span class="placeholder">Click BYPASS...</span>
</div>
</div>
<div class="foot">
<span onclick="clearAll()">Clear</span> | <span>@SGCodexs</span>
</div>
</div>

<script>
var F='';
function toast(){var t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1500)}

async function bypass(){
var u=document.getElementById('url').value.trim();
var b=document.getElementById('btn'),l=document.getElementById('load'),r=document.getElementById('res');
if(!u)return;
b.disabled=true;b.textContent='WAIT...';l.classList.add('show');
r.className='res wait';r.innerHTML='Processing...';
F='';

// ===== PHƯƠNG PHÁP 1: Fetch trực tiếp qua proxy =====
try{
var p1='https://api.allorigins.win/raw?url='+encodeURIComponent(u);
var x1=await fetch(p1);
if(x1.ok){
var h=await x1.text();
// Tìm tất cả URL trong HTML
var urls=h.match(/https?:\/\/[^\s"'<>\[\]]{15,}/gi)||[];
var good=[];
for(var i=0;i<urls.length;i++){
var v=urls[i].replace(/\\/g,'').trim();
if(v.indexOf('link4m')==-1&&v.indexOf('cloudflare')==-1&&v.indexOf('.js')==-1&&v.indexOf('.css')==-1&&v.indexOf('.png')==-1&&v.indexOf('.jpg')==-1&&v.indexOf('google.com')==-1&&v.indexOf('facebook')==-1&&v.indexOf('googletagmanager')==-1&&v.indexOf('recaptcha')==-1&&v.indexOf('favicon')==-1&&v.indexOf('yoads')==-1&&v.indexOf('analytics')==-1&&v.length>20)good.push(v);
}
// Chọn link dài nhất
if(good.length>0){
var best=good[0];
for(var j=1;j<good.length;j++){if(good[j].length>best.length)best=good[j]}
F=best;
}
}
}catch(e){}

// ===== PHƯƠNG PHÁP 2: Tự tạo /go/ link =====
if(!F){
try{
var d=u.replace('https://','').replace('http://','').split('/')[0];
var k=u.split('/').pop();
var paths=['/go/','/direct/','/get/'];
for(var p=0;p<paths.length;p++){
var gu='https://'+d+paths[p]+k;
var x2=await fetch(gu,{method:'GET',redirect:'follow'});
if(x2.url!==gu&&x2.url.indexOf('link4m')===-1){F=x2.url;break}
}
}catch(e){}
}

// ===== PHƯƠNG PHÁP 3: Dùng bypass.pm =====
if(!F){
try{
var x3=await fetch('https://bypass.pm/bypass',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
if(x3.ok){var d3=await x3.json();if(d3.destination)F=d3.destination;else if(d3.url)F=d3.url}
}catch(e){}
}

l.classList.remove('show');
b.disabled=false;b.textContent='BYPASS';

if(F){
r.className='res good';
r.innerHTML='<b>SUCCESS!</b>\n\n'+F+'\n\n<span style="color:#888;font-size:10px">Click to copy</span>';
toast();
}else{
r.className='res bad';
r.innerHTML='<b>FAILED</b>\n\nCannot bypass. Try opening in browser.';
}
}

function copyRes(){if(F){navigator.clipboard.writeText(F).then(toast).catch(function(){var t=document.createElement('textarea');t.value=F;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast()})}}
function clearAll(){document.getElementById('url').value='';document.getElementById('res').className='res';document.getElementById('res').innerHTML='<span class="placeholder">Click BYPASS...</span>';F='';document.getElementById('url').focus()}
</script>
</body>
</html>
