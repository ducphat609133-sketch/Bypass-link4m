<style>

<script>
// ===== BIẾN =====
var finalLink = '';
var logVisible = false;

// ===== LINK4M PATTERNS =====
var link4mDomains = [
  'link4m.com', 'link4m.net', 'link4m.org',
  'link4m.app', 'link4m.xyz', 'link4m.me', 'link4m.info',
  'link4m.co', 'link4m.vip', 'link4m.pro', 'link4m.top'
];

var redirectPaths = [
  '/go/', '/direct/', '/get/', '/link/', '/out/',
  '/redirect/', '/download/', '/dl/', '/d/', '/file/',
  '/skip/', '/unlock/', '/proceed/'
];

// ===== EVENT LISTENERS =====
document.getElementById('linkInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doBypass();
});

// ===== LOG =====
function log(msg, type) {
  var lb = document.getElementById('logBox');
  lb.classList.add('show');
  var cls = type === 'g' ? 'g' : (type === 'r' ? 'r' : (type === 'y' ? 'y' : 'o'));
  lb.innerHTML += '<div class="log-line ' + cls + '">' + msg + '</div>';
  lb.scrollTop = lb.scrollHeight;

function toggleLog() {
  logVisible = !logVisible;
  var lb = document.getElementById('logBox');
  if (logVisible) lb.classList.add('show');
  else lb.classList.remove('show');
}

// ===== NHẬN DIỆN LINK4M =====
function isLink4m(url) {
  var lower = url.toLowerCase();
  for (var i = 0; i < link4mDomains.length; i++) {
    if (lower.indexOf(link4mDomains[i]) !== -1) return true;
  }
  return false;
}

function getLink4mDomain(url) {
  var lower = url.toLowerCase();
  for (var i = 0; i < link4mDomains.length; i++) {
    if (lower.indexOf(link4mDomains[i]) !== -1) return link4mDomains[i];
  }
  return '';
}

function getDomain(url) {
  return url.replace('https://', '').replace('http://', '').split('/')[0];
}

// ===== TẠO TẤT CẢ LINK REDIRECT =====
function generateRedirects(url) {
  var links = [];
  var domain = getDomain(url);
  var parts = url.replace('https://', '').replace('http://', '').split('/');
  var key = parts[1] || '';
  if (!key) return links;

  for (var i = 0; i < redirectPaths.length; i++) {
    links.push('https://' + domain + redirectPaths[i] + key);
  }
  // Thêm link gốc vào đầu
  links.unshift(url);
  return links;
}

// ===== EXTRACT LINK TỪ HTML =====
function extractLinks(html) {
  html = html.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\\\//g, '/');

  var found = [];

  var patterns = [
    /<meta[^>]*http-equiv=["']refresh["'][^>]*content=["']\d+;\s*url=([^"'\s>]+)/i,
    /window\.location(?:\s*\.\s*href)?\s*=\s*["']([^"']{5,})["']/gi,
    /location\.(?:replace|assign|href)\s*\(\s*["']([^"']{5,})["']\s*\)/gi,
    /window\.open\s*\(\s*["']([^"']{5,})["']/gi,
    /<a[^>]*href\s*=\s*["'](https?:\/\/[^"']+?)["'][^>]*>/gi,
    /<a[^>]*href\s*=\s*["'](\/[^"']*\/[^"']{3,})["'][^>]*>/gi,
    /data-(?:url|link|href|redirect|target|dest|go|download|file|direct)\s*=\s*["'](https?:\/\/[^"']+)["']/gi,
    /atob\s*\(\s*["']([A-Za-z0-9+/=]{20,})["']\s*\)/g,
    /(?:var|let|const)\s+\w+\s*=\s*["'](https?:\/\/[^\s"'<>]{15,}?)["']/gi,
    /["'](?:url|link|redirect|target|dest|download|file|get|go|direct|source|drive)["']\s*:\s*["'](https?:\/\/[^"']{8,}?)["']/gi
  ];

  for (var i = 0; i < patterns.length; i++) {
    var p = patterns[i];
    if (p.flags && p.flags.indexOf('g') !== -1) {
      var ms = html.matchAll(p);
      for (var m of ms) { if (m[1]) found.push(m[1]); }
    } else {
      var mc = html.match(p);
      if (mc && mc[1]) found.push(mc[1]);
    }
  }

  // Scripts
  var scs = [];
  var sr = /<script[^>]*>([\s\S]*?)<\/script>/gi;
  var sm;
  while ((sm = sr.exec(html)) !== null) scs.push(sm[1]);
  for (var s = 0; s < scs.length; s++) {
    var sc = scs[s];
    var su = sc.match(/https?:\/\/[^\s"'`\[\]{}()\\]{10,}/gi);
    if (su) found = found.concat(su);
  }

  var au = html.match(/https?:\/\/[^\s"'<>\[\]{}()\\]{10,}/gi);
  if (au) found = found.concat(au);

  // Làm sạch
  var clean = [];
  for (var i = 0; i < found.length; i++) {
    var u = found[i];
    if (typeof u !== 'string') continue;
    u = u.replace(/\\/g, '').trim().replace(/^["'`]+|["'`]+$/g, '');
    if (u.indexOf('//') === 0) u = 'https:' + u;
    if (u.indexOf('http') === 0 && u.length > 15) clean.push(u);
  }

  // Loại trùng
  var seen = {};
  var uniq = [];
  for (var i = 0; i < clean.length; i++) {
    if (!seen[clean[i]]) { seen[clean[i]] = true; uniq.push(clean[i]); }
  }

  return uniq;
}

// ===== CHỌN LINK TỐT NHẤT =====
function pickBestLink(links) {
  if (links.length === 0) return null;

  // 1. Tìm link redirect nội bộ (/go/, /direct/...)
  for (var i = 0; i < links.length; i++) {
    for (var j = 0; j < redirectPaths.length; j++) {
      if (links[i].indexOf(redirectPaths[j]) !== -1) {
        log('  🎯 Redirect nội bộ: ' + links[i].substring(0, 60), 'y');
        return links[i];
      }
    }
  }

  // 2. Lọc bỏ rác
  var bl = ['cloudflare', 'recaptcha', 'googletagmanager', 'facebook.net',
    '.js', '.css', '.png', '.jpg', '.jpeg', '.svg', '.ico', '.gif',
    '.woff', '.ttf', 'analytics', 'gtag', 'ajax', 'yoads', 'favicon'
  ];
  var filtered = [];
  for (var i = 0; i < links.length; i++) {
    var u = links[i];
    var l = u.toLowerCase();
    var bad = false;
    for (var j = 0; j < bl.length; j++) {
      if (l.indexOf(bl[j]) !== -1) { bad = true; break; }
    }
    if (!bad) filtered.push(u);
  }

  // 3. Ưu tiên link download
  var prio = ['drive.google.com', 'docs.google.com', 'mega.nz', 'mediafire.com',
    'dropbox.com', 'pastebin.com', 'github.com', 'download', 'file',
    'get', 'zip', 'rar', '7z', 'exe', 'apk', 'pdf', 'mp4', 'mp3'
  ];
  for (var i = 0; i < prio.length; i++) {
    for (var j = 0; j < filtered.length; j++) {
      if (filtered[j].toLowerCase().indexOf(prio[i]) !== -1) {
        log('  ⭐ Ưu tiên: ' + prio[i], 'g');
        return filtered[j];
      }
    }
  }

  // 4. Link dài nhất
  if (filtered.length > 0) {
    var longest = filtered[0];
    for (var i = 1; i < filtered.length; i++) {
      if (filtered[i].length > longest.length) longest = filtered[i];
    }
    log('  📏 Dài nhất: ' + longest.length + ' ký tự', 'o');
    return longest;
  }

  return null;
}

// ===== FOLLOW REDIRECT =====
async function followRedirects(links) {
  for (var i = 0; i < links.length; i++) {
    var link = links[i];
    try {
      log('  🔄 Thử: ' + link.substring(0, 60));
      var ctrl = new AbortController();
      var to = setTimeout(function() { ctrl.abort(); }, 6000);
      var res = await fetch(link, {
        method: 'GET',
        redirect: 'follow',
        signal: ctrl.signal,
        headers: {
          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
          'Accept': 'text/html,application/xhtml+xml'
        }
      });
      clearTimeout(to);

      if (res.url !== link && !isLink4m(res.url)) {
        log('  ✅ Redirect đến: ' + res.url.substring(0, 60), 'g');
        return res.url;
      }

      // Parse HTML tìm meta refresh
      var html = await res.text();
      var meta = html.match(/<meta[^>]*http-equiv=["']refresh["'][^>]*content=["']\d+;\s*url=([^"'\s>]+)/i);
      if (meta && meta[1]) {
        var next = meta[1];
        if (next.indexOf('http') !== 0) {
          var domain = getDomain(link);
          next = 'https://' + domain + '/' + next.replace(/^\//, '');
        }
        if (!isLink4m(next)) {
          log('  ✅ Meta refresh: ' + next.substring(0, 60), 'g');
          return next;
        }
      }
    } catch (e) {
      log('  ❌ ' + e.message.substring(0, 30), 'r');
    }
  }
  return null;
}

// ===== KIỂM TRA LINK ĐÍCH =====
async function checkLink(url) {
  log('  🔬 Kiểm tra link đích...');
  var r = { alive: false, isFile: false, fileName: '', fileSize: '', httpCode: 0 };

  try {
    var ctrl = new AbortController();
    var to = setTimeout(function() { ctrl.abort(); }, 8000);
    var res = await fetch(url, {
      method: 'HEAD',
      signal: ctrl.signal,
      headers: { 'User-Agent': 'Mozilla/5.0' }
    });
    clearTimeout(to);

    r.httpCode = res.status;
    var ct = res.headers.get('content-type') || '';
    var cl = res.headers.get('content-length') || '';
    var disp = res.headers.get('content-disposition') || '';
    r.fileSize = cl;

    if (res.status === 200 || res.status === 302 || res.status === 301) {
      r.alive = true;
      log('  ✅ HTTP ' + res.status + ' - Link sống', 'g');
    } else if (res.status === 404) {
      log('  ❌ 404 - Link chết', 'r');
    } else {
      log('  ⚠ HTTP ' + res.status, 'o');
    }

    var ctl = ct.toLowerCase();
    var fileTypes = ['zip', 'rar', '7z', 'octet-stream', 'exe', 'apk', 'pdf', 'mp4', 'mpeg', 'android', 'x-rar', 'x-7z'];
    for (var i = 0; i < fileTypes.length; i++) {
      if (ctl.indexOf(fileTypes[i]) !== -1) {
        r.isFile = true;
        var fn = url.split('/').pop().split('?')[0];
        r.fileName = fn && fn.indexOf('.') !== -1 ? fn : 'file';
        log('  📁 FILE: ' + r.fileName + ' (' + fmtSize(r.fileSize) + ')', 'g');
        break;
      }
    }

    if (!r.isFile && (disp.indexOf('attachment') !== -1 || disp.indexOf('filename') !== -1)) {
      r.isFile = true;
      var fm = disp.match(/filename[^;=\n]*=["']?([^"';\n]+)["']?/i);
      if (fm) r.fileName = fm[1];
      log('  📥 File download: ' + r.fileName, 'g');
    }

    if (!r.isFile && (ctl.indexOf('html') !== -1 || ctl.indexOf('text') !== -1)) {
      log('  🌐 Trang web, không phải file', 'o');
    }

  } catch (e) {
    log('  ❌ Không check được: ' + e.message.substring(0, 30), 'r');
  }

  // Fallback: đoán từ URL
  if (!r.isFile) {
    var lo = url.toLowerCase();
    var exts = ['.zip', '.rar', '.7z', '.exe', '.apk', '.ipa', '.pdf', '.mp4', '.mp3', '.mkv', '.avi', '.dmg', '.iso', '.tar', '.gz'];
    for (var i = 0; i < exts.length; i++) {
      if (lo.indexOf(exts[i]) !== -1) {
        r.isFile = true;
        r.fileName = url.split('/').pop().split('?')[0];
        log('  📁 Đuôi file: ' + exts[i], 'g');
        break;
      }
    }
  }

  return r;
}

function fmtSize(b) {
  if (!b || b === '0') return 'Không rõ';
  var n = parseInt(b);
  if (isNaN(n)) return b;
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}

// ===== BYPASS CHÍNH =====
async function doBypass() {
  var input = document.getElementById('linkInput');
  var url = input.value.trim();
  var btn = document.getElementById('btnBypass');
  var spinner = document.getElementById('spinner');
  var resultBox = document.getElementById('resultBox');
  var btnOpen = document.getElementById('btnOpen');
  var logBox = document.getElementById('logBox');

  logBox.innerHTML = '';
  resultBox.className = 'result';
  resultBox.innerHTML = '<span class="placeholder">Đang xử lý...</span>';
  btnOpen.classList.remove('show');
  finalLink = '';

  if (!url) {
    resultBox.className = 'result error';
    resultBox.innerHTML = '⚠ Vui lòng nhập link Link4m!';
    return;
  }

  if (!isLink4m(url)) {
    resultBox.className = 'result error';
    resultBox.innerHTML = '⚠ Link không phải Link4m!\nHỗ trợ: .com .net .org .app .xyz .me .info .co .vip .pro .top';
    return;
  }

  // Hiển thị domain nhận diện
  var detectedDomain = getLink4mDomain(url);
  var tags = document.querySelectorAll('.variant-tag');
  for (var t = 0; t < tags.length; t++) {
    tags[t].classList.remove('active');
    if (tags[t].textContent === '.' + detectedDomain.split('.').pop()) {
      tags[t].classList.add('active');
    }
  }

  log('🔍 Bắt đầu bypass...', 'y');
  log('📎 Domain: ' + detectedDomain, 'y');
  log('🔗 Link: ' + url.substring(0, 50) + '...', 'y');

  btn.disabled = true;
  btn.textContent = 'ĐANG BYPASS...';
  spinner.classList.add('show');

  var destination = null;

  // ===== METHOD 1: BYPASS.PM API =====
  log('📡 Method 1: Bypass.pm API...');
  try {
    var apiRes = await fetch('https://bypass.pm/bypass', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
