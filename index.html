function extractAllLinks(html){
html=html.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\\\//g,'/').replace(/\\"/g,'"');
var found=[];

// Meta refresh
var m1=html.match(/<meta[^>]*http-equiv\s*=\s*["']refresh["'][^>]*content\s*=\s*["']\d+\s*;\s*url\s*=\s*([^"'\s>]+)/i);
if(m1&&m1[1])found.push(m1[1]);

// window.location = "..."
var m2=html.match(/window\.location(?:\s*\.\s*href)?\s*=\s*["']([^"']{5,})["']/gi);
if(m2)for(var i=0;i<m2.length;i++){var t=m2[i].match(/["']([^"']+)["']/);if(t)found.push(t[1])}

// location.replace/href/assign("...")
var m3=html.match(/location\.(?:replace|assign|href)\s*\(\s*["']([^"']{5,})["']\s*\)/gi);
if(m3)for(var i=0;i<m3.length;i++){var t=m3[i].match(/["']([^"']+)["']/);if(t)found.push(t[1])}

// window.open("...")
var m4=html.match(/window\.open\s*\(\s*["']([^"']{5,})["']/gi);
if(m4)for(var i=0;i<m4.length;i++){var t=m4[i].match(/["']([^"']+)["']/);if(t)found.push(t[1])}

// <a href="...">
var m5=html.match(/<a[^>]*href\s*=\s*["'](https?:\/\/[^"']+?)["'][^>]*>/gi);
if(m5)for(var i=0;i<m5.length;i++){var t=m5[i].match(/href\s*=\s*["']([^"']+)["']/i);if(t)found.push(t[1])}

// onclick="location='...'"
var m6=html.match(/onclick\s*=\s*["'][^"']*(?:location|window\.open|href)\s*[=\(]\s*["']([^"']{5,})["']/gi);
if(m6)for(var i=0;i<m6.length;i++){var t=m6[i].match(/["']([^"']{5,})["']$/);if(t)found.push(t[1])}

// data-url="..."
var m7=html.match(/data-(?:url|link|href|redirect|target|dest|go|download|file|direct)\s*=\s*["'](https?:\/\/[^"']+)["']/gi);
if(m7)for(var i=0;i<m7.length;i++){var t=m7[i].match(/["'](https?:\/\/[^"']+)["']/i);if(t)found.push(t[1])}

// atob("...")
var m8=html.match(/atob\s*\(\s*["']([A-Za-z0-9+/=]{20,})["']\s*\)/g);
if(m8)for(var i=0;i<m8.length;i++){var t=m8[i].match(/["']([A-Za-z0-9+/=]{20,})["']/);if(t)try{var d=atob(t[1]);if(d.indexOf('http')===0)found.push(d)}catch(e){}}

// var x = "https://..."
var m9=html.match(/(?:var|let|const)\s+\w+\s*=\s*["'](https?:\/\/[^\s"'<>]{15,}?)["']/gi);
if(m9)for(var i=0;i<m9.length;i++){var t=m9[i].match(/["'](https?:\/\/[^"']+)["']/);if(t)found.push(t[1])}

// "url":"...", "link":"..."
var m10=html.match(/["'](?:url|link|redirect|target|dest|download|file|get|go|direct|source|drive)["']\s*:\s*["'](https?:\/\/[^"']{8,}?)["']/gi);
if(m10)for(var i=0;i<m10.length;i++){var t=m10[i].match(/["'](https?:\/\/[^"']+)["']/);if(t)found.push(t[1])}

// Script content
var scripts=[];var sr=/<script[^>]*>([\s\S]*?)<\/script>/gi;var sm;
while((sm=sr.exec(html))!==null)scripts.push(sm[1]);
for(var s=0;s<scripts.length;s++){
var sc=scripts[s];
var su=sc.match(/https?:\/\/[^\s"'`\[\]{}()\\]{10,}/gi);if(su)found=found.concat(su);
var eu=sc.match(/https?:\\\/\\\/[^\s"'`\[\]{}()\\]{10,}/gi);if(eu)for(var e=0;e<eu.length;e++)found.push(eu[e].replace(/\\\//g,'/'));
// Lấy link trong dấu `` template literals
var tl=sc.match(/`(https?:\/\/[^`]{10,})`/gi);if(tl)for(var t=0;t<tl.length;t++)found.push(tl[t].replace(/`/g,''));
}

// Tất cả URL thô
var allUrls=html.match(/https?:\/\/[^\s"'<>\[\]{}()\\]{10,}/gi);
if(allUrls)found=found.concat(allUrls);

// Làm sạch
var clean=[];
for(var i=0;i<found.length;i++){
var u=found[i];if(typeof u!=='string')continue;
u=u.replace(/\\/g,'').trim().replace(/^["'`]+|["'`]+$/g,'');
if(u.indexOf('//')===0)u='https:'+u;
if(u.indexOf('http')===0&&u.length>15)clean.push(u);
}

// Loại trùng
var seen={};var unique=[];
for(var i=0;i<clean.length;i++){if(!seen[clean[i]]){seen[clean[i]]=true;unique.push(clean[i])}}
log('📊 Tất cả link unique ('+unique.length+'):','info');
for(var i=0;i<unique.length;i++){log('  ['+i+'] '+unique[i].substring(0,80),'link');}

// Blacklist - chỉ chặn domain rác, không chặn file host
var bl=['challenges.cloudflare.com','cloudflare.com','link4m.com','link4m.net','link4m.app','link4m.','ouo.io','ouo.press','shrinkme.io','shrinkme.','shortconnect.com','shortconnect.','work.ink','adf.ly','adfoc.us','j.gs','q.gs','ay.gy','bit.ly','bitly.','tinyurl.com','tinyurl.','shorte.st','gestyy.com','google.com/search','google.com/url','facebook.com','twitter.com','youtube.com','instagram.com','tiktok.com','w3.org','schema.org','jquery','bootstrap','fontawesome','googletagmanager','gstatic','googleapis','doubleclick','facebook.net','pinterest','cdnjs','jsdelivr','unpkg','.js','.css','.png','.jpg','.jpeg','.svg','.ico','.gif','.woff','.ttf','ajax','analytics','gtag','cdn.','static.'];
var filtered=[];
for(var i=0;i<unique.length;i++){
var u=unique[i];var l=u.toLowerCase();
var bad=false;
for(var j=0;j<bl.length;j++){if(l.indexOf(bl[j])!==-1){bad=true;break}}
if(!bad)filtered.push(u);
}
log('🔍 Sau blacklist còn '+filtered.length+' link:','info');
for(var i=0;i<filtered.length;i++){log('  ✅ '+filtered[i].substring(0,80),'good');}

// Nếu không còn link nào, thử lại với blacklist nhẹ hơn (chỉ chặn link4m và cloudflare)
if(filtered.length===0){
log('⚠ Blacklist chặt quá, thử lại với blacklist nhẹ...','warn');
var softBL=['challenges.cloudflare.com','cloudflare.com','link4m.com','link4m.net','link4m.app','link4m.'];
filtered=[];
for(var i=0;i<unique.length;i++){
var u=unique[i];var l=u.toLowerCase();
var bad=false;
for(var j=0;j<softBL.length;j++){if(l.indexOf(softBL[j])!==-1){bad=true;break}}
if(!bad)filtered.push(u);
}
log('🔍 Blacklist nhẹ còn '+filtered.length+' link:','info');
for(var i=0;i<filtered.length;i++){log('  ✅ '+filtered[i].substring(0,80),'good');}
}

if(filtered.length===0)return null;

// Ưu tiên link download
var prio=['drive.google.com','docs.google.com','mega.nz','mediafire.com','dropbox.com','zippyshare.com','pastebin.com','github.com','/download','/file/','/get/','/dl/','dl=','zip','rar','7z','exe','apk','ipa','pdf','mp4','mp3','mkv'];
for(var i=0;i<prio.length;i++){
for(var j=0;j<filtered.length;j++){
if(filtered[j].toLowerCase().indexOf(prio[i])!==-1){
log('⭐ Ưu tiên: '+prio[i],'good');
return filtered[j];
}
}
}

// Link dài nhất (thường là link đích)
var longest=filtered[0];
for(var i=1;i<filtered.length;i++){if(filtered[i].length>longest.length)longest=filtered[i]}
log('📏 Link dài nhất: '+longest.length+' ký tự','info');
return longest;
}

async function checkLink(url){
log('🔬 Kiểm tra link...','info');
var r={alive:false,isFile:false,fileName:'',fileSize:'',httpCode:0};
try{
var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort()},6000);
var res=await fetch(url,{method:'HEAD',signal:ctrl.signal,headers:{'User-Agent':'Mozilla/5.0'}});
clearTimeout(to);
r.httpCode=res.status;
var ct=res.headers.get('content-type')||'';
var cl=res.headers.get('content-length')||'';
var disp=res.headers.get('content-disposition')||'';
r.fileSize=cl;

if(res.status===200||res.status===302||res.status===301){
r.alive=true;
log('✅ HTTP '+res.status+' - Link sống','good');
}else if(res.status===404){
log('❌ 404 - Link chết','bad');
}else{
log('⚠ HTTP '+res.status,'warn');
}

// Kiểm tra có phải file không
var ctLower=ct.toLowerCase();
if(ctLower.indexOf('zip')!==-1||ctLower.indexOf('rar')!==-1||ctLower.indexOf('7z')!==-1||ctLower.indexOf('octet-stream')!==-1||ctLower.indexOf('exe')!==-1||ctLower.indexOf('apk')!==-1||ctLower.indexOf('pdf')!==-1||ctLower.indexOf('mp4')!==-1||ctLower.indexOf('mpeg')!==-1||ctLower.indexOf('android')!==-1||ctLower.indexOf('x-rar')!==-1||ctLower.indexOf('x-7z')!==-1){
r.isFile=true;
var fn=url.split('/').pop().split('?')[0];
if(fn&&fn.indexOf('.')!==-1)r.fileName=fn;else r.fileName='file_'+ctLower.split('/')[1];
log('📁 FILE: '+r.fileName+' ('+formatSize(cl)+')','good');
}else if(disp.indexOf('attachment')!==-1||disp.indexOf('filename')!==-1){
r.isFile=true;
var fm=disp.match(/filename[^;=\n]*=["']?([^"';\n]+)["']?/i);
if(fm)r.fileName=fm[1];
log('📥 File download: '+r.fileName,'good');
}else if(ctLower.indexOf('html')!==-1){
log('🌐 Là trang web','info');
}
}catch(e){
log('❌ Không kiểm tra được: '+e.message.substring(0,30),'bad');
}

// Fallback: đoán từ URL
if(!r.isFile){
var lower=url.toLowerCase();
var exts=['.zip','.rar','.7z','.exe','.apk','.ipa','.pdf','.mp4','.mp3','.mkv','.avi','.dmg','.iso','.tar','.gz','.torrent'];
for(var i=0;i<exts.length;i++){if(lower.indexOf(exts[i])!==-1){r.isFile=true;r.fileName=url.split('/').pop().split('?')[0];log('📁 Đuôi file: '+exts[i],'good');break}}
if(!r.isFile){
var dlks=['download','file','get','dl=','/dl/','/file/','/get/','/d/','?download','&download'];
for(var j=0;j<dlks.length;j++){if(lower.indexOf(dlks[j])!==-1){r.isFile=true;log('📁 Keyword download: '+dlks[j],'good');break}}
}
}
return r;
}

function formatSize(b){
if(!b||b==='0')return'Không rõ';
var n=parseInt(b);if(isNaN(n))return b;
if(n<1024)return n+' B';
if(n<1048576)return(n/1024).toFixed(1)+' KB';
if(n<1073741824)return(n/1048576).toFixed(1)+' MB';
return(n/1073741824).toFixed(2)+' GB';
}

async function bypass(){
var input=document.getElementById('linkInput');
var url=input.value.trim();
var logBox=document.getElementById('logBox');
var btnOpen=document.getElementById('btnOpen');

logBox.innerHTML='';
btnOpen.style.display='none';
finalLink='';

if(!url){showResult('⚠ Vui lòng nhập link!','error');return}

log('🔍 Bắt đầu bypass...','info');
log('📎 Link: '+url,'info');
showLoading(true);
showResult('Đang xử lý...','info');

var result=null;

// Method 1: Bypass.pm API
log('📡 Method 1: Bypass.pm API','info');
try{
var res1=await fetch('https://bypass.pm/bypass',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})});
if(res1.ok){var data=await res1.json();if(data.destination){result=data.destination;log('✅ Bypass.pm OK','good')}else if(data.url){result=data.url;log('✅ Bypass.pm OK','good')}}else{log('❌ HTTP '+res1.status,'bad')}
}catch(e){log('❌ Lỗi: '+e.message,'bad')}

// Method 2: Jina AI
if(!result){
log('📡 Method 2: Jina AI','info');
try{
var jinaUrl='https://r.jina.ai/https://'+url.replace('https://','').replace('http://','');
var res2=await fetch(jinaUrl,{headers:{'Accept':'text/markdown'}});
if(res2.ok){
var text=await res2.text();
log('✅ Jina OK - '+text.length+' ký tự','good');
if(text.indexOf('turnstile')!==-1||text.indexOf('cloudflare')!==-1){log('⚠ Jina bị Cloudflare','warn')}
else{var ext=extractAllLinks(text);if(ext){result=ext;log('🎯 Jina tìm thấy!','good')}else{log('⚠ Jina không thấy link','warn')}}
}else{log('❌ HTTP '+res2.status,'bad')}
}catch(e){log('❌ Lỗi: '+e.message,'bad')}
}

// Method 3: Proxy
if(!result){
log('📡 Method 3: Proxy fetch','info');
var proxies=['https://api.allorigins.win/raw?url=','https://corsproxy.io/?','https://api.codetabs.com/v1/proxy?quest='];
for(var p=0;p<proxies.length;p++){
if(result)break;
try{
var proxyUrl=proxies[p]+encodeURIComponent(url);
log('  Thử proxy #'+(p+1)+'...');
var res3=await fetch(proxyUrl,{headers:{'User-Agent':'Mozilla/5.0'}});
if(res3.ok){
var html=await res3.text();
log('  ✅ Proxy #'+(p+1)+' OK - '+html.length+' ký tự','good');
if(html.indexOf('challenges.cloudflare.com')!==-1||html.indexOf('turnstile')!==-1||html.indexOf('cf-browser-verify')!==-1){
log('  ⚠ Cloudflare, bỏ qua','warn');continue;
}
var ext=extractAllLinks(html);
if(ext){result=ext;log('  🎯 TÌM THẤY!','good');break}
else{log('  ⚠ Không thấy link','warn')}
}else{log('  ❌ HTTP '+res3.status,'bad')}
}catch(e){log('  ❌ Lỗi: '+e.message,'bad')}
}
}

showLoading(false);

if(result){
result=result.replace(/\\/g,'').replace(/&amp;/g,'&').trim();
if(result.indexOf('http')!==0)result='https://'+result.replace(/^\/+/,'');
finalLink=result;

// Kiểm tra link
log('🔬 Đang kiểm tra link...','info');
var ck=await checkLink(result);

var statusHTML='';
if(ck.alive&&ck.isFile){
statusHTML='<span class="status-badge status-alive">✅ FILE DOWNLOAD: '+ck.fileName+' ('+formatSize(ck.fileSize)+')</span>';
showResultBox(result,'success',statusHTML);
log('🏆 THÀNH CÔNG - FILE!','good');
btnOpen.style.display='block';
}else if(ck.alive&&!ck.isFile){
statusHTML='<span class="status-badge status-web">⚠ LINK SỐNG NHƯNG LÀ TRANG WEB</span>';
showResultBox(result,'warning',statusHTML);
log('⚠ Link sống nhưng không phải file download','warn');
btnOpen.style.display='block';
}else if(!ck.alive&&ck.httpCode===404){
statusHTML='<span class="status-badge status-dead">❌ 404 - LINK CHẾT, HÃY THỬ FILE KHÁC</span>';
showResultBox(result,'error',statusHTML);
log('💀 404 - File không tồn tại','bad');
}else{
statusHTML='<span class="status-badge status-dead">❌ KHÔNG TRUY CẬP ĐƯỢC (HTTP '+ck.httpCode+')</span>';
showResultBox(result,'error',statusHTML);
log('💀 Không truy cập được','bad');
}
}else{
showResult('❌ KHÔNG BYPASS ĐƯỢC\nThử link khác nhé!','error');
log('💀 THẤT BẠI','bad');
}
}

function showResultBox(link,type,statusHTML){
var rb=document.getElementById('resultBox');
rb.className='result-box';
if(type==='success')rb.classList.add('success');
else if(type==='warning')rb.classList.add('warning');
else rb.classList.add('error');
rb.innerHTML='<div>'+link+'</div>'+statusHTML;
}

function showResult(msg,type){
var rb=document.getElementById('resultBox');
rb.className='result-box';
if(type==='success')rb.classList.add('success');
else if(type==='error')rb.classList.add('error');
rb.innerHTML=msg;
}

function copyLink(){
if(finalLink&&finalLink.indexOf('http')===0){
navigator.clipboard.writeText(finalLink).then(function(){
var t=document.getElementById('toast');t.classList.add('show');
setTimeout(function(){t.classList.remove('show')},1500);
}).catch(function(){
var ta=document.createElement('textarea');ta.value=finalLink;
ta.style.position='fixed';ta.style.left='-9999px';
document.body.appendChild(ta);ta.select();
document.execCommand('copy');document.body.removeChild(ta);
var t=document.getElementById('toast');t.classList.add('show');
setTimeout(function(){t.classList.remove('show')},1500);
});
}
}
function openLink(){if(finalLink&&finalLink.indexOf('http')===0)window.open(finalLink,'_blank')}
