<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Link4m Bypass - Devils Will Rise</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif}
.wrapper{width:90%;max-width:500px;text-align:center;padding:15px}
.logo{font-family:'Courier New',monospace;font-size:24px;font-weight:bold;color:#ff003c;text-shadow:0 0 20px #ff003c;letter-spacing:3px;margin-bottom:3px}
.subtitle{color:#666;font-size:10px;margin-bottom:12px}
.subtitle span{color:#ff003c}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:18px}
input{width:100%;padding:14px;background:#1a1a1a;border:2px solid #333;border-radius:25px;color:#fff;font-size:14px;outline:none;margin-bottom:10px;text-align:center}
input:focus{border-color:#ff003c}
.btn-row{display:flex;gap:8px}
.btn-row button{flex:1;padding:14px;background:#ff003c;color:#fff;border:none;border-radius:25px;font-size:15px;font-weight:bold;cursor:pointer;letter-spacing:2px}
.btn-row .btn-sm{flex:0;width:50px;background:#222;color:#ff003c;border:1px solid #ff003c;font-size:16px}
button:active{transform:scale(0.97)}
button.loading{opacity:0.6}
.result-box{margin-top:14px;background:#0d0d0d;border:2px solid #222;border-radius:12px;padding:16px;min-height:50px;word-break:break-all;cursor:pointer;font-family:'Courier New',monospace;font-size:13px}
.result-box.success{border-color:#00ff41;color:#00ff41}
.result-box.error{border-color:#ff003c;color:#ff4444}
.s-badge{display:inline-block;margin-top:5px;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:bold}
.s-ok{background:#002200;color:#00ff41;border:1px solid #00ff41}
.s-dead{background:#220000;color:#ff4444;border:1px solid #ff4444}
.placeholder{color:#333;font-size:12px}
.iframe-box{width:100%;height:350px;border:2px solid #333;border-radius:12px;overflow:hidden;margin-top:10px;display:none;position:relative}
.iframe-box.show{display:block}
.iframe-box iframe{width:100%;height:100%;border:none}
.iframe-bar{background:#1a1a1a;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#888}
.iframe-bar button{width:auto;padding:4px 10px;font-size:10px;border-radius:8px;background:#333;color:#fff;border:1px solid #555;letter-spacing:0}
.iframe-bar .url-display{color:#ffcc00;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.log-box{margin-top:10px;background:#0a0a0a;border-radius:8px;padding:10px;max-height:120px;overflow-y:auto;text-align:left;display:none}
.log-box.show{display:block}
.log-line{color:#555;font-size:9px;font-family:'Courier New',monospace;padding:2px 0}
.log-line.good{color:#00ff41}
.log-line.bad{color:#ff4444}
.log-line.info{color:#ffcc00}
.footer{margin-top:12px;color:#444;font-size:10px}
.footer span{color:#ff003c;cursor:pointer}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#00ff41;color:#000;padding:8px 20px;border-radius:20px;font-weight:bold;font-size:12px;z-index:999;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="toast" id="toast">✅ Đã copy!</div>
<div class="wrapper">
<div class="logo">DEVILS WILL RISE</div>
<div class="subtitle">Owner <span>@DP</span> | <span>@SGCodexs</span></div>
<div class="card">
<input type="text" id="linkInput" placeholder="Dán link Link4m vào đây..." autocomplete="off" autofocus>
<div class="btn-row">
<button id="btnBypass" onclick="openFrame()">🔓 MỞ LINK4M</button>
<button class="btn-sm" id="btnCopy" onclick="copyLink()" style="display:none">📋</button>
</div>
<div class="result-box" id="resultBox" onclick="copyLink()">
<span class="placeholder">Bấm MỞ LINK4M → Vượt Cloudflare → Link đích sẽ hiện ở đây</span>
</div>
<div class="iframe-box" id="iframeBox">
<div class="iframe-bar">
<span class="url-display" id="frameUrl">Đang load...</span>
<button onclick="closeFrame()">✕ Đóng</button>
</div>
<iframe id="hiddenFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation allow-popups-to-escape-sandbox"></iframe>
</div>
<div class="log-box" id="logBox"></div>
</div>
<div class="footer">
<span onclick="clearAll()">🗑 Clear</span> | <span>💀 @SGCodexs</span> | <span onclick="toggleLog()">📋 Log</span>
</div>
</div>

<script>
var finalLink='';
var logVisible=true;
var pollInterval=null;

document.getElementById('linkInput').addEventListener('keydown',function(e){if(e.key==='Enter')openFrame()});

function log(msg,type){var lb=document.getElementById('logBox');lb.classList.add('show');lb.innerHTML+='<div class="log-line '+(type||'')+'">'+msg+'</div>';lb.scrollTop=lb.scrollHeight}
function toggleLog(){logVisible=!logVisible;var lb=document.getElementById('logBox');if(logVisible)lb.classList.add('show');else lb.classList.remove('show')}

function openFrame(){
var input=document.getElementById('linkInput');var url=input.value.trim();
var frame=document.getElementById('hiddenFrame');
var frameBox=document.getElementById('iframeBox');
var frameUrl=document.getElementById('frameUrl');
var resultBox=document.getElementById('resultBox');
var btnCopy=document.getElementById('btnCopy');
var logBox=document.getElementById('logBox');

logBox.innerHTML='';btnCopy.style.display='none';finalLink='';
resultBox.className='result-box';
resultBox.innerHTML='<span class="placeholder">Đang mở Link4m trong browser ẩn...</span>';

if(!url){resultBox.className='result-box error';resultBox.innerHTML='⚠ Nhập link đi!';return}
if(url.indexOf('link4m')===-1){resultBox.className='result-box error';resultBox.innerHTML='⚠ Không phải link Link4m!';return}

log('🔓 Đang mở: '+url.substring(0,50)+'...','info');
log('💡 Browser ẩn sẽ load Link4m thật, vượt Cloudflare','info');
log('⏳ Chờ trang load và redirect...','info');

frameBox.classList.add('show');
frameUrl.textContent='Đang load...';
frame.src=url;

// Clear poll cũ
if(pollInterval)clearInterval(pollInterval);

// Poll URL của iframe mỗi 1 giây
pollInterval=setInterval(function(){
try{
var currentUrl=frame.contentWindow.location.href;
frameUrl.textContent=currentUrl;

// Kiểm tra nếu đã redirect ra khỏi link4m
if(currentUrl.indexOf('link4m')===-1&&currentUrl.indexOf('cloudflare')===-1&&currentUrl.indexOf('about:blank')===-1&&currentUrl.indexOf('javascript:')===-1){
finalLink=currentUrl;
resultBox.className='result-box success';
resultBox.innerHTML='<div>✅ '+currentUrl+'</div><span class="s-badge s-ok">✅ LINK ĐÍCH - CLICK ĐỂ COPY</span>';
btnCopy.style.display='block';
log('🎯 BYPASS THÀNH CÔNG!','good');
log('🔗 '+currentUrl,'info');
clearInterval(pollInterval);
}
}catch(e){
// Cross-origin - không đọc được URL
frameUrl.textContent='(đang load - bấm Tôi là người nếu có)';
}
},1000);

// Timeout sau 60 giây
setTimeout(function(){
if(!finalLink){
log('⏰ Hết thời gian chờ. Nếu thấy link đích trong browser ẩn, copy thủ công nhé.','warn');
clearInterval(pollInterval);
}
},60000);
}

function closeFrame(){
document.getElementById('iframeBox').classList.remove('show');
document.getElementById('hiddenFrame').src='';
if(pollInterval)clearInterval(pollInterval);
}

function copyLink(){
var link=finalLink;
// Thử lấy từ iframe nếu chưa có
if(!link){
try{
link=document.getElementById('hiddenFrame').contentWindow.location.href;
if(link.indexOf('link4m')!==-1||link.indexOf('about:blank')!==-1)link=null;
}catch(e){}
}
if(link&&link.indexOf('http')===0){
navigator.clipboard.writeText(link).then(function(){
var t=document.getElementById('toast');t.classList.add('show');
setTimeout(function(){t.classList.remove('show')},1500);
}).catch(function(){
var ta=document.createElement('textarea');ta.value=link;
ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);
ta.select();document.execCommand('copy');document.body.removeChild(ta);
var t=document.getElementById('toast');t.classList.add('show');
setTimeout(function(){t.classList.remove('show')},1500);
});
}
}

function clearAll(){
document.getElementById('linkInput').value='';
document.getElementById('resultBox').className='result-box';
document.getElementById('resultBox').innerHTML='<span class="placeholder">Bấm MỞ LINK4M → Vượt Cloudflare → Link đích sẽ hiện ở đây</span>';
document.getElementById('logBox').innerHTML='';
document.getElementById('btnCopy').style.display='none';
document.getElementById('iframeBox').classList.remove('show');
document.getElementById('hiddenFrame').src='';
finalLink='';
if(pollInterval)clearInterval(pollInterval);
document.getElementById('linkInput').focus();
}
</script>
</body>
</html>
