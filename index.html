<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Link4m Bypass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif}
.wrapper{width:90%;max-width:500px;text-align:center;padding:15px}
.logo{font-family:'Courier New',monospace;font-size:24px;font-weight:bold;color:#ff003c;text-shadow:0 0 20px #ff003c;letter-spacing:3px;margin-bottom:3px}
.subtitle{color:#666;font-size:10px;margin-bottom:15px}
.subtitle span{color:#ff003c}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:20px}
input{width:100%;padding:14px;background:#1a1a1a;border:2px solid #333;border-radius:25px;color:#fff;font-size:14px;outline:none;margin-bottom:10px;text-align:center}
input:focus{border-color:#ff003c}
.btn-row{display:flex;gap:8px}
.btn-row button{flex:1;padding:14px;background:#ff003c;color:#fff;border:none;border-radius:25px;font-size:15px;font-weight:bold;cursor:pointer;letter-spacing:2px}
.btn-row .btn-open{flex:0;width:48px;background:#222;color:#ff003c;border:1px solid #ff003c;font-size:18px}
button:active{transform:scale(0.97)}
button.loading{opacity:0.6;pointer-events:none}
.result-box{margin-top:14px;background:#0d0d0d;border:2px solid #222;border-radius:12px;padding:16px;min-height:50px;word-break:break-all;cursor:pointer;font-family:'Courier New',monospace;font-size:13px}
.result-box.success{border-color:#00ff41;color:#00ff41}
.result-box.warning{border-color:#ff6600;color:#ff6600}
.result-box.error{border-color:#ff003c;color:#ff4444}
.s-badge{display:inline-block;margin-top:5px;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:bold}
.s-ok{background:#002200;color:#00ff41;border:1px solid #00ff41}
.s-web{background:#221100;color:#ff6600;border:1px solid #ff6600}
.s-dead{background:#220000;color:#ff4444;border:1px solid #ff4444}
.placeholder{color:#333;font-size:12px}
.log-box{margin-top:10px;background:#0a0a0a;border-radius:8px;padding:10px;max-height:180px;overflow-y:auto;text-align:left;display:none}
.log-box.show{display:block}
.log-line{color:#555;font-size:9px;font-family:'Courier New',monospace;padding:2px 0}
.log-line.good{color:#00ff41}
.log-line.bad{color:#ff4444}
.log-line.info{color:#ffcc00}
.spinner{width:22px;height:22px;border:3px solid #333;border-top:3px solid #ff003c;border-radius:50%;animation:spin 0.7s linear infinite;margin:8px auto;display:none}
.spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:12px;color:#444;font-size:10px}
.footer span{color:#ff003c;cursor:pointer}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#00ff41;color:#000;padding:8px 20px;border-radius:20px;font-weight:bold;font-size:12px;z-index:999;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="toast" id="toast">✅ Đã copy!</div>
<div class="wrapper">
<div class="logo">DEVILS WILL RISE</div>
<div class="subtitle">Owner <span>@DP</span> | <span>@SGCodexs</span></div>
<div class="card">
<input type="text" id="linkInput" placeholder="Dán link Link4m vào đây..." autocomplete="off" autofocus>
<div class="btn-row">
<button id="btnBypass" onclick="bypass()">⚡ BYPASS</button>
<button class="btn-open" id="btnOpen" onclick="openLink()" style="display:none">↗</button>
</div>
<div class="spinner" id="spinner"></div>
<div class="result-box" id="resultBox" onclick="copyLink()">
<span class="placeholder">Link gốc sẽ hiện ở đây...</span>
</div>
<div class="log-box" id="logBox"></div>
</div>
<div class="footer">
<span onclick="clearAll()">🗑 Clear</span> | <span>💀 @SGCodexs</span> | <span onclick="toggleLog()">📋 Log</span>
</div>
</div>
<script>
var finalLink='';
var logVisible=true;
document.getElementById('linkInput').addEventListener('keydown',function(e){if(e.key==='Enter')bypass()});
function log(msg,type){var lb=document.getElementById('logBox');lb.classList.add('show');lb.innerHTML+='<div class="log-line '+(type||'')+'">'+msg+'</div>';lb.scrollTop=lb.scrollHeight}
function toggleLog(){logVisible=!logVisible;var lb=document.getElementById('logBox');if(logVisible)lb.classList.add('show');else lb.classList.remove('show')}
function showLoading(s){var sp=document.getElementById('spinner');var b=document.getElementById('btnBypass');if(s){sp.classList.add('show');b.classList.add('loading');b.textContent='ĐANG XỬ LÝ...'}else{sp.classList.remove('show');b.classList.remove('loading');b.textContent='⚡ BYPASS'}}

function isLink4m(u){return u.indexOf('link4m.com')!==-1||u.indexOf('link4m.net')!==-1||u.indexOf('link4m.org')!==-1}
function getDomain(u){return u.replace('https://','').replace('http://','').split('/')[0]}

function generateRedirects(url){
var links=[];var d=getDomain(url);var parts=url.replace('https://','').replace('http://','').split('/');var key=parts[1]||'';if(!key)return links;
var paths=['/go/','/get/','/download/','/link/','/out/','/redirect/','/dl/','/d/'];
for(var i=0;i<paths.length;i++){links.push('https://'+d+paths[i]+key)}
return links;
}

async function follow(u,depth){
if(depth>8)return u;
log('  🔄 ['+depth+'] '+u.substring(0,60),'info');
try{
var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort()},5000);
var res=await fetch(u,{method:'HEAD',redirect:'follow',signal:ctrl.signal,headers:{'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}});
clearTimeout(to);
if(res.redirected&&res.url!==u){log('  ➡ '+res.url.substring(0,60),'good');if(isLink4m(res.url))return await follow(res.url,depth+1);return res.url}
return u;
}catch(e){log('  ❌ '+e.message.substring(0,30),'bad');return u}
}

function extractLinks(html){
html=html.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\\\//g,'/');
var found=[];
var pat=[/<meta[^>]*http-equiv\s*=\s*["']refresh["'][^>]*content\s*=\s*["']\d+\s*;\s*url\s*=\s*([^"'\s>]+)/i,/window\.location(?:\s*\.\s*href)?\s*=\s*["']([^"']{5,})["']/gi,/location\.(?:replace|assign|href)\s*\(\s*["']([^"']{5,})["']\s*\)/gi,/window\.open\s*\(\s*["']([^"']{5,})["']/gi,/<a[^>]*href\s*=\s*["'](https?:\/\/[^"']+?)["'][^>]*>/gi,/onclick\s*=\s*["'][^"']*(?:location|window\.open|href)\s*[=\(]\s*["']([^"']{5,})["']/gi,/data-(?:url|link|href|redirect|target|dest|go|download|file|direct)\s*=\s*["'](https?:\/\/[^"']+)["']/gi,/atob\s*\(\s*["']([A-Za-z0-9+/=]{20,})["']\s*\)/g,/(?:var|let|const)\s+\w+\s*=\s*["'](https?:\/\/[^\s"'<>]{15,}?)["']/gi];
for(var i=0;i<pat.length;i++){var p=pat[i];if(p.flags&&p.flags.indexOf('g')!==-1){var ms=html.matchAll(p);for(var m of ms){if(m[1])found.push(m[1])}}else{var mc=html.match(p);if(mc&&mc[1])found.push(mc[1])}}
var scs=[];var sr=/<script[^>]*>([\s\S]*?)<\/script>/gi;var sm;while((sm=sr.exec(html))!==null)scs.push(sm[1]);
for(var s=0;s<scs.length;s++){var sc=scs[s];var su=sc.match(/https?:\/\/[^\s"'`\[\]{}()\\]{10,}/gi);if(su)found=found.concat(su)}
var au=html.match(/https?:\/\/[^\s"'<>\[\]{}()\\]{10,}/gi);if(au)found=found.concat(au);
var cl=[];for(var i=0;i<found.length;i++){var u=found[i];if(typeof u!=='string')continue;u=u.replace(/\\/g,'').trim().replace(/^["'`]+|["'`]+$/g,'');if(u.indexOf('//')===0)u='https:'+u;if(u.indexOf('http')===0&&u.length>15)cl.push(u)}
var seen={};var uniq=[];for(var i=0;i<cl.length;i++){if(!seen[cl[i]]){seen[cl[i]]=true;uniq.push(cl[i])}}
log('📊 '+uniq.length+' link','info');
for(var i=0;i<Math.min(uniq.length,10);i++)log('  ['+i+'] '+uniq[i].substring(0,80),'link');
for(var i=0;i<uniq.length;i++){if(uniq[i].indexOf('/go/')!==-1||uniq[i].indexOf('/redirect/')!==-1||uniq[i].indexOf('/link/')!==-1||uniq[i].indexOf('/out/')!==-1||uniq[i].indexOf('/get/')!==-1||uniq[i].indexOf('/download/')!==-1||uniq[i].indexOf('/dl/')!==-1){log('🎯 Redirect nội bộ: '+uniq[i].substring(0,60),'good');return uniq[i]}}
var bl=['cloudflare','google.com/recaptcha','googletagmanager','facebook.net','.js','.css','.png','.jpg','.jpeg','.svg','.ico','.gif','.woff','.ttf','analytics','gtag','ajax','yoads','favicon','static.'];
var fl=[];for(var i=0;i<uniq.length;i++){var u=uniq[i];var l=u.toLowerCase();var bad=false;for(var j=0;j<bl.length;j++){if(l.indexOf(bl[j])!==-1){bad=true;break}}if(!bad)fl.push(u)}
log('🔍 Sau lọc: '+fl.length,'info');for(var i=0;i<fl.length;i++)log('  ✅ '+fl[i].substring(0,80),'good');
if(fl.length===0)return null;
var prio=['drive.google.com','docs.google.com','mega.nz','mediafire.com','dropbox.com','pastebin.com','github.com','download','file','get','zip','rar','7z','exe','apk','pdf','mp4','mp3'];
for(var i=0;i<prio.length;i++){for(var j=0;j<fl.length;j++){if(fl[j].toLowerCase().indexOf(prio[i])!==-1){log('⭐ '+prio[i],'good');return fl[j]}}}
var lo=fl[0];for(var i=1;i<fl.length;i++){if(fl[i].length>lo.length)lo=fl[i]}return lo;
}

async function checkLink(u){
log('🔬 Kiểm tra...','info');
var r={alive:false,isFile:false,fn:'',fs:'',code:0};
try{
var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort()},6000);
var res=await fetch(u,{method:'HEAD',signal:ctrl.signal,headers:{'User-Agent':'Mozilla/5.0'}});
clearTimeout(to);r.code=res.status;var ct=res.headers.get('content-type')||'';var cl=res.headers.get('content-length')||'';var disp=res.headers.get('content-disposition')||'';r.fs=cl;
if(res.status===200||res.status===302||res.status===301){r.alive=true;log('✅ HTTP '+res.status,'good')}else if(res.status===404)log('❌ 404','bad');else log('⚠ '+res.status,'warn');
var ctl=ct.toLowerCase();
if(ctl.indexOf('zip')!==-1||ctl.indexOf('rar')!==-1||ctl.indexOf('7z')!==-1||ctl.indexOf('octet-stream')!==-1||ctl.indexOf('exe')!==-1||ctl.indexOf('apk')!==-1||ctl.indexOf('pdf')!==-1||ctl.indexOf('mp4')!==-1||ctl.indexOf('mpeg')!==-1||ctl.indexOf('android')!==-1){r.isFile=true;var fn=u.split('/').pop().split('?')[0];r.fn=fn&&fn.indexOf('.')!==-1?fn:'file';log('📁 FILE: '+r.fn+' ('+fmt(cl)+')','good')}
else if(disp.indexOf('attachment')!==-1){r.isFile=true;var fm=disp.match(/filename[^;=\n]*=["']?([^"';\n]+)["']?/i);if(fm)r.fn=fm[1];log('📥 File: '+r.fn,'good')}
else if(ctl.indexOf('html')!==-1)log('🌐 Web','info');
}catch(e){log('❌ '+e.message.substring(0,30),'bad')}
if(!r.isFile){var lo=u.toLowerCase();var ex=['.zip','.rar','.7z','.exe','.apk','.ipa','.pdf','.mp4','.mp3','.mkv','.avi','.dmg','.iso','.tar','.gz'];for(var i=0;i<ex.length;i++){if(lo.indexOf(ex[i])!==-1){r.isFile=true;r.fn=u.split('/').pop().split('?')[0];log('📁 Đuôi: '+ex[i],'good');break}}}
return r;
}
function fmt(b){if(!b||b==='0')return'?';var n=parseInt(b);if(isNaN(n))return b;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}

async function bypass(){
var input=document.getElementById('linkInput');var url=input.value.trim();var lb=document.getElementById('logBox');var bo=document.getElementById('btnOpen');
lb.innerHTML='';bo.style.display='none';finalLink='';
if(!url){showR('⚠ Vui lòng nhập link!','error');return}
log('🔍 Bắt đầu bypass...','info');log('📎 '+url,'info');showLoading(true);showR('Đang xử lý...','info');
var R=null;

// M1: bypass.pm
log('📡 M1: Bypass.pm','info');
try{var r1=await fetch('https://bypass.pm/bypass',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})});if(r1.ok){var d=await r1.json();if(d.destination){R=d.destination;log('✅ OK','good')}else if(d.url){R=d.url;log('✅ OK','good')}}}catch(e){log('❌ '+e.message,'bad')}

// M2: Jina
if(!R){log('📡 M2: Jina AI','info');
try{var r2=await fetch('https://r.jina.ai/https://'+url.replace('https://','').replace('http://',''),{headers:{'Accept':'text/markdown'}});
if(r2.ok){var t=await r2.text();log('✅ '+t.length+' ký tự','good');
if(t.indexOf('turnstile')!==-1||t.indexOf('cloudflare')!==-1)log('⚠ Cloudflare','warn');
else{var ex=extractLinks(t);if(ex){R=ex;log('🎯 OK','good')}}}
}catch(e){log('❌ '+e.message,'bad')}}

// M3: Proxy
if(!R){log('📡 M3: Proxy','info');
var pl=['https://api.allorigins.win/raw?url=','https://corsproxy.io/?','https://api.codetabs.com/v1/proxy?quest='];
for(var p=0;p<pl.length;p++){if(R)break;
try{var pu=pl[p]+encodeURIComponent(url);log('  #'+(p+1)+'...');
var r3=await fetch(pu,{headers:{'User-Agent':'Mozilla/5.0'}});
if(r3.ok){var h=await r3.text();log('  ✅ '+h.length+' ký tự','good');
if(h.indexOf('challenges.cloudflare.com')!==-1||h.indexOf('turnstile')!==-1){log('  ⚠ CF','warn');continue}
var ex=extractLinks(h);if(ex){R=ex;log('  🎯 OK','good');break}}
}catch(e){log('  ❌ '+e.message,'bad')}}}

// M4: Follow redirects
if(!R&&isLink4m(url)){log('📡 M4: Follow redirects...','info');
var redirs=generateRedirects(url);log('  🔗 '+redirs.length+' link để thử','info');
for(var i=0;i<redirs.length;i++){if(R)break;
log('  Thử: '+redirs[i].substring(0,60));
try{var fw=await follow(redirs[i],0);if(fw!==redirs[i]&&!isLink4m(fw)){R=fw;log('  🎯 Follow OK!','good');break}else log('  ⚠ Vẫn Link4m','warn')}catch(e){log('  ❌ '+e.message,'bad')}}
}

showLoading(false);
if(R){R=R.replace(/\\/g,'').replace(/&amp;/g,'&').trim();if(R.indexOf('http')!==0)R='https://'+R.replace(/^\/+/,'');finalLink=R;
var ck=await checkLink(R);var bd='';
if(ck.alive&&ck.isFile){bd='<span class="s-badge s-ok">✅ FILE: '+ck.fn+' ('+fmt(ck.fs)+')</span>';showRB(R,'success',bd);log('🏆 FILE!','good');bo.style.display='block'}
else if(ck.alive&&!ck.isFile){bd='<span class="s-badge s-web">⚠ TRANG WEB</span>';showRB(R,'warning',bd);log('⚠ Web','warn');bo.style.display='block'}
else if(!ck.alive&&ck.code===404){bd='<span class="s-badge s-dead">❌ 404 - HÃY THỬ FILE KHÁC</span>';showRB(R,'error',bd);log('💀 404','bad')}
else{bd='<span class="s-badge s-dead">❌ KHÔNG TRUY CẬP ĐƯỢC</span>';showRB(R,'error',bd);log('💀 Lỗi','bad')}
}else{showR('❌ KHÔNG BYPASS ĐƯỢC!','error');log('💀 THẤT BẠI','bad')}
}
function showRB(l,t,b){var rb=document.getElementById('resultBox');rb.className='result-box';if(t==='success')rb.classList.add('success');else if(t==='warning')rb.classList.add('warning');else rb.classList.add('error');rb.innerHTML='<div>'+l+'</div>'+b}
function showR(m,t){var rb=document.getElementById('resultBox');rb.className='result-box';if(t==='success')rb.classList.add('success');else if(t==='error')rb.classList.add('error');rb.innerHTML=m}
function copyLink(){if(finalLink&&finalLink.indexOf('http')===0){navigator.clipboard.writeText(finalLink).then(function(){var t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1500)}).catch(function(){var ta=document.createElement('textarea');ta.value=finalLink;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);var t=document.getElementById('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1500)})}}
function openLink(){if(finalLink&&finalLink.indexOf('http')===0)window.open(finalLink,'_blank')}
function clearAll(){document.getElementById('linkInput').value='';document.getElementById('resultBox').className='result-box';document.getElementById('resultBox').innerHTML='<span class="placeholder">Link gốc sẽ hiện ở đây...</span>';document.getElementById('logBox').innerHTML='';document.getElementById('btnOpen').style.display='none';finalLink='';document.getElementById('linkInput').focus()}
</script>
</body>
</html>
