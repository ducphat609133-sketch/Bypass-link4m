<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bypass Tool V2 - Devils Will Rise</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif}
.wrapper{width:90%;max-width:500px;text-align:center;padding:15px}
.logo{font-family:'Courier New',monospace;font-size:26px;font-weight:bold;color:#ff003c;text-shadow:0 0 20px #ff003c;letter-spacing:3px;margin-bottom:3px}
.subtitle{color:#666;font-size:10px;margin-bottom:15px}
.subtitle span{color:#ff003c}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:20px}
input{width:100%;padding:14px;background:#1a1a1a;border:2px solid #333;border-radius:25px;color:#fff;font-size:14px;outline:none;margin-bottom:10px;text-align:center}
input:focus{border-color:#ff003c}
button{width:100%;padding:14px;background:#ff003c;color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;letter-spacing:2px}
button:active{transform:scale(0.97)}
button.loading{opacity:0.6;pointer-events:none}
.result-box{margin-top:14px;background:#0d0d0d;border:2px solid #222;border-radius:12px;padding:16px;min-height:50px;word-break:break-all;cursor:pointer;font-family:'Courier New',monospace;font-size:13px}
.result-box.success{border-color:#00ff41;color:#00ff41}
.result-box.error{border-color:#ff003c;color:#ff4444}
.placeholder{color:#333;font-size:12px}
.hint{color:#666;font-size:10px;margin-top:8px}
.hint span{color:#ffcc00;cursor:pointer}
.hint span:hover{text-decoration:underline}
.iframe-container{width:100%;height:400px;margin-top:10px;border:2px solid #333;border-radius:12px;overflow:hidden;display:none}
.iframe-container.show{display:block}
.iframe-container iframe{width:100%;height:100%;border:none}
.spinner{width:24px;height:24px;border:3px solid #333;border-top:3px solid #ff003c;border-radius:50%;animation:spin 0.8s linear infinite;margin:10px auto;display:none}
.spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.log-box{margin-top:10px;background:#0a0a0a;border-radius:8px;padding:10px;max-height:120px;overflow-y:auto;text-align:left;display:none}
.log-box.show{display:block}
.log-line{color:#555;font-size:10px;font-family:'Courier New',monospace;padding:2px 0}
.log-line.good{color:#00ff41}
.log-line.bad{color:#ff4444}
.log-line.info{color:#ffcc00}
.footer{margin-top:14px;color:#444;font-size:10px}
.footer span{color:#ff003c;cursor:pointer}
.footer span:hover{color:#fff}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#00ff41;color:#000;padding:8px 20px;border-radius:20px;font-weight:bold;font-size:12px;z-index:999;display:none}
.toast.show{display:block}
.btn-row{display:flex;gap:8px}
.btn-row button{flex:1}
.btn-small{width:50px;flex:0!important;background:#222;color:#ff003c;border:1px solid #ff003c;font-size:18px}
</style>
</head>
<body>
<div class="toast" id="toast">✅ Đã copy!</div>
<div class="wrapper">
<div class="logo">DEVILS WILL RISE</div>
<div class="subtitle">Owner <span>@DP</span> | <span>@SGCodexs</span></div>
<div class="card">
<input type="text" id="linkInput" placeholder="Dán link Link4m vào đây..." autocomplete="off" autofocus>
<div class="btn-row">
<button id="btnBypass" onclick="openInFrame()">🔓 MỞ & BYPASS</button>
<button class="btn-small" id="btnCopy" onclick="copyLink()" style="display:none">📋</button>
</div>
<div class="spinner" id="spinner"></div>
<div class="result-box" id="resultBox" onclick="copyLink()">
<span class="placeholder">Link gốc sẽ hiện ở đây...</span>
</div>
<div class="hint">👆 Click link để copy | <span onclick="toggleFrame()">🖼 Mở browser ẩn</span></div>
<div class="iframe-container" id="iframeBox">
<iframe id="hiddenFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation"></iframe>
</div>
<div class="log-box" id="logBox"></div>
</div>
<div class="footer">
<span onclick="clearAll()">🗑 Clear</span> | <span>💀 @SGCodexs</span> | <span onclick="toggleLog()">📋 Log</span>
</div>
</div>

<script>
var finalLink='';
var logVisible=true;

document.getElementById('linkInput').addEventListener('keydown',function(e){if(e.key==='Enter')openInFrame()});

function log(msg,type){
var lb=document.getElementById('logBox');
lb.classList.add('show');
var cls=type||'';
lb.innerHTML+='<div class="log-line '+cls+'">'+msg+'</div>';
lb.scrollTop=lb.scrollHeight;
}

function toggleLog(){logVisible=!logVisible;var lb=document.getElementById('logBox');if(logVisible)lb.classList.add('show');else lb.classList.remove('show')}
function toggleFrame(){var f=document.getElementById('iframeBox');if(f.classList.contains('show'))f.classList.remove('show');else f.classList.add('show')}

function openInFrame(){
var input=document.getElementById('linkInput');
var url=input.value.trim();
var frame=document.getElementById('hiddenFrame');
var frameBox=document.getElementById('iframeBox');
var logBox=document.getElementById('logBox');
var btnCopy=document.getElementById('btnCopy');
var resultBox=document.getElementById('resultBox');

logBox.innerHTML='';
btnCopy.style.display='none';
finalLink='';
resultBox.className='result-box';
resultBox.innerHTML='<span class="placeholder">Đang mở link trong browser ẩn...</span>';

if(!url){resultBox.className='result-box error';resultBox.innerHTML='⚠ Vui lòng nhập link!';return}

log('🔍 Đang mở: '+url.substring(0,50)+'...','info');
log('💡 Browser ẩn sẽ load trang Link4m thật','info');
log('⏳ Chờ Cloudflare challenge hoàn thành...','info');
log('📋 Sau đó copy link đích từ browser ẩn','info');

frameBox.classList.add('show');
frame.src=url;

// Lắng nghe khi iframe load xong
frame.onload=function(){
try{
var iframeUrl=frame.contentWindow.location.href;
log('✅ Browser ẩn đã load: '+iframeUrl.substring(0,60)+'...','good');

// Nếu đã redirect ra link khác (không còn link4m)
if(iframeUrl.indexOf('link4m')===-1&&iframeUrl.indexOf('cloudflare')===-1){
finalLink=iframeUrl;
resultBox.className='result-box success';
resultBox.innerHTML='✅ '+finalLink;
btnCopy.style.display='block';
log('🎯 BYPASS THÀNH CÔNG!','good');
log('🔗 Link gốc: '+finalLink,'info');
}else{
log('⚠ Vẫn ở trang Link4m/Cloudflare, cần click thủ công','warn');
log('💡 Hãy bấm nút "Tôi là người" trong browser ẩn bên dưới','info');
log('📋 Sau đó copy link từ browser ẩn','info');
}
}catch(e){
log('⚠ Không đọc được iframe (cross-origin)','warn');
log('💡 Hãy nhìn browser ẩn bên dưới và copy link thủ công','info');
log('📋 Khi trang đích load xong, bấm nút "Tôi là người" rồi copy URL','info');
}
};

// Fallback: thử bypass bằng API sau 5 giây
setTimeout(async function(){
if(!finalLink){
log('📡 Thử bypass API trong lúc chờ...','info');
try{
var res=await fetch('https://bypass.pm/bypass',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})});
if(res.ok){var d=await res.json();if(d.destination||d.url){var link=d.destination||d.url;finalLink=link;resultBox.className='result-box success';resultBox.innerHTML='✅ '+link;btnCopy.style.display='block';log('🎯 API bypass thành công!','good');}}
}catch(e){log('❌ API fallback thất bại','bad')}
}
},5000);
}

function copyLink(){
if(!finalLink&&document.getElementById('hiddenFrame').contentWindow){
try{finalLink=document.getElementById('hiddenFrame').contentWindow.location.href}catch(e){}
}
if(finalLink&&finalLink.indexOf('http')===0){
navigator.clipboard.writeText(finalLink).then(function(){
var t=document.getElementById('toast');t.classList.add('show');
setTimeout(function(){t.classList.remove('show')},1500);
}).catch(function(){
var ta=document.createElement('textarea');ta.value=finalLink;
ta.style.position='fixed';ta.style.left='-9999px';
document.body.appendChild(ta);ta.select();
document.execCommand('copy');document.body.removeChild(ta);
var t=document.getElementById('toast');t.classList.add('show');
setTimeout(function(){t.classList.remove('show')},1500);
});
}
}

function clearAll(){
document.getElementById('linkInput').value='';
document.getElementById('resultBox').className='result-box';
document.getElementById('resultBox').innerHTML='<span class="placeholder">Link gốc sẽ hiện ở đây...</span>';
document.getElementById('logBox').innerHTML='';
document.getElementById('btnCopy').style.display='none';
document.getElementById('iframeBox').classList.remove('show');
document.getElementById('hiddenFrame').src='';
finalLink='';
document.getElementById('linkInput').focus();
}
</script>
</body>
</html>
